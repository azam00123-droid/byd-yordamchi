name: EXE yasash (kompyuter)

on:
  push:
    paths:
      - '.github/workflows/build-pc.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dastur fayllarini yaratish
        run: |
          cat > yordamchi.py <<'YORDAMCHI_EOF'
          # -*- coding: utf-8 -*-
          """
          Yordamchi — Windows uchun o'zbekcha ovozli yordamchi.
          Fonda (tray'da) turadi, "Yordamchi" deb chaqirilganda buyruqni bajaradi.
          """
          import os
          import sys
          import json
          import queue
          import random
          import re
          import threading
          import time
          import datetime
          import subprocess
          import webbrowser
          import urllib.parse

          ILOVA_NOMI = "Yordamchi"


          # ------------------------------------------------------------------ yo'llar
          def manba(*qism):
              """PyInstaller ichidagi yoki skript yonidagi fayl yo'li"""
              asos = getattr(sys, "_MEIPASS", os.path.dirname(os.path.abspath(__file__)))
              return os.path.join(asos, *qism)


          # ------------------------------------------------------------------ matnni tozalash
          KIRILL = {
              "а": "a", "б": "b", "в": "v", "г": "g", "д": "d", "е": "e", "ё": "yo", "ж": "j", "з": "z",
              "и": "i", "й": "y", "к": "k", "л": "l", "м": "m", "н": "n", "о": "o", "п": "p", "р": "r",
              "с": "s", "т": "t", "у": "u", "ф": "f", "х": "x", "ц": "s", "ч": "ch", "ш": "sh", "щ": "sh",
              "ъ": "", "ы": "i", "ь": "", "э": "e", "ю": "yu", "я": "ya", "ў": "o", "қ": "q", "ғ": "g", "ҳ": "h",
          }


          def normalize(s):
              s = "".join(KIRILL.get(ch, ch) for ch in s.lower())
              s = re.sub(r"[‘’ʻʼ`'´]", "", s)
              s = re.sub(r"[^a-z0-9 ]", " ", s)
              return re.sub(r"\s+", " ", s).strip()


          KERAKSIZ = {"menga", "iltimos", "ni", "ga", "ilova", "dastur", "yordamchi", "bilan",
                      "uchun", "hozir", "qil", "ber", "papkasini", "papkani"}
          QOSHIMCHALAR = ["ning", "gacha", "dan", "ga", "ka", "qa", "ni", "da", "ta"]


          def maqsad(t, kalitlar):
              """Buyruqdan kalit so'zlarni olib tashlab, nishonni qoldiradi"""
              for k in kalitlar:
                  t = re.sub(r"\b" + re.escape(k) + r"\b", " ", t)
              sozlar = [w for w in t.split() if w and w not in KERAKSIZ]
              if not sozlar:
                  return ""
              oxirgi = sozlar[-1]
              for q in QOSHIMCHALAR:
                  if len(oxirgi) > len(q) + 2 and oxirgi.endswith(q):
                      sozlar[-1] = oxirgi[: -len(q)]
                      break
              return " ".join(sozlar)


          def bor(t, *kalitlar):
              return any(k in t for k in kalitlar)


          # ------------------------------------------------------------------ buyruqni tushunish
          # Tez-tez ishlatiladigan nomlar -> Windows'da ochiladigan narsa
          TAXALLUS = {
              "bloknot": "notepad", "notepad": "notepad", "blaknot": "notepad",
              "kalkulyator": "calc", "kalkulator": "calc",
              "fayllar": "explorer", "provodnik": "explorer", "explorer": "explorer",
              "sozlamalar": "ms-settings:", "nastroyka": "ms-settings:",
              "vazifa menejeri": "taskmgr", "dispetcher": "taskmgr",
              "paint": "mspaint", "rasm chizish": "mspaint",
              "brauzer": "https://www.google.com", "internet": "https://www.google.com",
              "google": "https://www.google.com",
              "youtube": "https://www.youtube.com", "yutub": "https://www.youtube.com", "yutup": "https://www.youtube.com",
          }

          PAPKALAR = {
              "yuklama": "Downloads", "zagruz": "Downloads", "yuklab olingan": "Downloads",
              "hujjat": "Documents", "xujjat": "Documents", "dokument": "Documents",
              "ish stoli": "Desktop", "rabochiy stol": "Desktop",
              "rasmlar": "Pictures", "musiqalar": "Music", "videolar": "Videos",
          }


          def tahlil(xom):
              """Matndan (amal, qiymat) juftligini aniqlaydi. Windows'ga tegmaydi — sinash oson."""
              t = normalize(xom)
              if not t:
                  return ("tushunmadim", None)
              # vaqt
              if bor(t, "soat necha", "soat nechi", "vaqt necha", "hozir soat"):
                  return ("vaqt", None)
              # kompyuter quvvati
              if bor(t, "bekor qil", "otmena", "toxtat ochirishni"):
                  return ("bekor", None)
              if bor(t, "kompyuterni ochir", "kompyuter ochir", "kompyuterni oching ochir", "vyklyuch"):
                  return ("pc_ochir", None)
              if bor(t, "qayta yoq", "qayta ishga tushir", "perezagruz", "restart"):
                  return ("pc_qayta", None)
              if bor(t, "uxlat", "uyqu rejim", "spyashiy"):
                  return ("pc_uyqu", None)
              if bor(t, "qulfla", "blokla", "zablokir"):
                  return ("pc_qulf", None)
              # ovoz
              if bor(t, "ovozni ochir", "ovozsiz"):
                  return ("ovoz_mute", "ovoz_ochir")
              if bor(t, "ovozni yoq", "ovozni qaytar"):
                  return ("ovoz_mute", "ovoz_yoq")
              if bor(t, "ovozni oshir", "balandroq", "baland qil", "kuchaytir", "ovozni kotar"):
                  return ("ovoz_oshir", None)
              if bor(t, "ovozni pasayt", "pastroq", "past qil", "sekinroq"):
                  return ("ovoz_pasayt", None)
              # musiqa
              if bor(t, "keyingi", "boshqa qoshiq", "boshqasini"):
                  return ("keyingi", None)
              if bor(t, "oldingi", "avvalgi"):
                  return ("oldingi", None)
              if bor(t, "toxtat", "pauza", "jim bol", "musiqa", "qoshiq", "davom et"):
                  return ("play_pause", None)
              # oynalar
              if bor(t, "oynani yop", "dasturni yop", "ilovani yop", "yopib qoy"):
                  return ("oyna_yop", None)
              if bor(t, "ish stolini korsat", "hammasini yig", "oynalarni yig"):
                  return ("ish_stoli", None)
              if bor(t, "skrinshot", "ekran rasmi", "ekranni rasmga"):
                  return ("skrinshot", None)
              # internetda qidirish
              if bor(t, "qidir", "izla", "topib ber"):
                  soz = maqsad(t, ["internetdan", "internetda", "googleda", "googledan", "qidirib ber",
                                   "qidir", "izlab ber", "izla", "topib ber"])
                  return ("qidir", soz)
              # papka
              for k, v in PAPKALAR.items():
                  if k in t and bor(t, "och", "papka", "kirit"):
                      return ("papka", v)
              # ilova ochish
              if re.search(r"\boch(ib ber)?\b", t) or bor(t, "ishga tushir", "yoqib ber"):
                  nom = maqsad(t, ["ochib ber", "och", "ishga tushir", "yoqib ber", "ilovasini",
                                   "ilovani", "dasturini", "dasturni"])
                  return ("ilova", nom)
              # suhbat
              if bor(t, "rahmat", "raxmat", "tashakkur"):
                  return ("rahmat", None)
              if bor(t, "qalaysan", "yaxshimisan", "salom", "assalomu"):
                  return ("qalay", None)
              if bor(t, "kimsan", "isming nima", "nima qila olasan"):
                  return ("kimsan", None)
              return ("tushunmadim", None)


          # ------------------------------------------------------------------ Windows amallari
          def tugma(*vk):
              """Klaviatura tugmalarini bosib qo'yib yuboradi"""
              import ctypes
              u = ctypes.windll.user32
              for k in vk:
                  u.keybd_event(k, 0, 0, 0)
              for k in reversed(vk):
                  u.keybd_event(k, 0, 2, 0)


          VK_VOL_MUTE, VK_VOL_DOWN, VK_VOL_UP = 0xAD, 0xAE, 0xAF
          VK_NEXT, VK_PREV, VK_PLAY = 0xB0, 0xB1, 0xB3
          VK_ALT, VK_F4, VK_WIN, VK_D, VK_PRTSC = 0x12, 0x73, 0x5B, 0x44, 0x2C

          _ilova_kesh = None


          def ilovalar_royxati():
              global _ilova_kesh
              if _ilova_kesh is not None:
                  return _ilova_kesh
              yollar = [
                  os.path.join(os.environ.get("ProgramData", ""), r"Microsoft\Windows\Start Menu\Programs"),
                  os.path.join(os.environ.get("APPDATA", ""), r"Microsoft\Windows\Start Menu\Programs"),
                  os.path.join(os.path.expanduser("~"), "Desktop"),
                  os.path.join(os.environ.get("PUBLIC", ""), "Desktop"),
              ]
              natija = {}
              for y in yollar:
                  if not os.path.isdir(y):
                      continue
                  for ildiz, _, fayllar in os.walk(y):
                      for f in fayllar:
                          if f.lower().endswith((".lnk", ".url")):
                              nom = normalize(os.path.splitext(f)[0])
                              if nom and "uninstall" not in nom and "udalit" not in nom:
                                  natija.setdefault(nom, os.path.join(ildiz, f))
              _ilova_kesh = natija
              return natija


          def ilova_top(nom):
              if not nom:
                  return None
              for k, v in TAXALLUS.items():
                  if k == nom or k in nom:
                      return v
              r = ilovalar_royxati()
              if nom in r:
                  return r[nom]
              for k, v in r.items():
                  if k.startswith(nom) or nom in k.split():
                      return v
              for k, v in r.items():
                  if nom in k or (len(k) >= 3 and k in nom):
                      return v
              return None


          def och(narsa):
              if narsa.startswith("http"):
                  webbrowser.open(narsa)
              else:
                  os.startfile(narsa)


          def bajar(xom):
              """Buyruqni bajaradi va (ok, matn, ovozlar) qaytaradi"""
              amal, q = tahlil(xom)
              try:
                  if amal == "vaqt":
                      n = datetime.datetime.now()
                      ov = [f"soat_{n.hour}"] if n.minute == 0 else [f"soatdan_{n.hour}", f"daq_{n.minute}"]
                      return True, f"Soat {n:%H:%M}", ov
                  if amal == "pc_ochir":
                      subprocess.run(["shutdown", "/s", "/t", "60"], creationflags=0x08000000)
                      return True, "1 daqiqadan keyin o'chadi", ["pc_ochir"]
                  if amal == "pc_qayta":
                      subprocess.run(["shutdown", "/r", "/t", "60"], creationflags=0x08000000)
                      return True, "1 daqiqadan keyin qayta yonadi", ["pc_qayta"]
                  if amal == "bekor":
                      subprocess.run(["shutdown", "/a"], creationflags=0x08000000)
                      return True, "Bekor qilindi", ["bekor"]
                  if amal == "pc_uyqu":
                      threading.Timer(3, lambda: subprocess.run(
                          ["rundll32.exe", "powrprof.dll,SetSuspendState", "0,1,0"], creationflags=0x08000000)).start()
                      return True, "Uxlash rejimi", ["pc_uyqu"]
                  if amal == "pc_qulf":
                      import ctypes
                      ctypes.windll.user32.LockWorkStation()
                      return True, "Qulflandi", ["pc_qulf"]
                  if amal == "ovoz_mute":
                      tugma(VK_VOL_MUTE); return True, "Ovoz o'chirildi" if q == "ovoz_ochir" else "Ovoz yoqildi", [q]
                  if amal == "ovoz_oshir":
                      for _ in range(5): tugma(VK_VOL_UP)
                      return True, "Ovoz oshirildi", ["ovoz_oshir"]
                  if amal == "ovoz_pasayt":
                      for _ in range(5): tugma(VK_VOL_DOWN)
                      return True, "Ovoz pasaytirildi", ["ovoz_pasayt"]
                  if amal == "keyingi":
                      tugma(VK_NEXT); return True, "Keyingi", ["keyingi"]
                  if amal == "oldingi":
                      tugma(VK_PREV); return True, "Oldingi", ["oldingi"]
                  if amal == "play_pause":
                      tugma(VK_PLAY); return True, "Ijro / pauza", ["pauza_pc"]
                  if amal == "oyna_yop":
                      tugma(VK_ALT, VK_F4); return True, "Oyna yopildi", ["oyna_yop"]
                  if amal == "ish_stoli":
                      tugma(VK_WIN, VK_D); return True, "Ish stoli", ["ish_stoli"]
                  if amal == "skrinshot":
                      tugma(VK_WIN, VK_PRTSC); return True, "Ekran rasmi olindi (Rasmlar → Screenshots)", ["skrinshot"]
                  if amal == "qidir":
                      if not q:
                          return False, "Nimani qidiray?", ["nima_qidir"]
                      webbrowser.open("https://www.google.com/search?q=" + urllib.parse.quote(q))
                      return True, f"Qidirilmoqda: {q}", ["qidir"]
                  if amal == "papka":
                      och(os.path.join(os.path.expanduser("~"), q))
                      return True, f"{q} ochildi", ["papka"]
                  if amal == "ilova":
                      if not q:
                          return False, "Qaysi ilovani ochay?", ["qaysi_ilova"]
                      yol = ilova_top(q)
                      if yol is None:
                          global _ilova_kesh
                          _ilova_kesh = None          # yangi o'rnatilgan bo'lishi mumkin — qayta qidiramiz
                          yol = ilova_top(q)
                      if yol is None:
                          return False, f"\"{q}\" topilmadi", ["ilova_yoq"]
                      och(yol)
                      return True, f"{q} ochildi", ["youtube" if "youtube" in yol else "ilova_och"]
                  if amal in ("rahmat", "qalay"):
                      return True, amal, [amal]
                  if amal == "kimsan":
                      return True, "Kompyuter yordamchisi", ["kimsan_pc"]
              except Exception as e:
                  return False, f"Xato: {e}", ["xato"]
              return False, f"Tushunmadim: {xom}", ["tushunmadim"]


          # ------------------------------------------------------------------ ovoz chiqarish
          class Ovoz:
              """mp3 javoblarni Windows'ning o'z pleyeri (MCI) orqali navbat bilan ijro etadi"""

              def __init__(self):
                  self.navbat = queue.Queue()
                  self.band = threading.Event()
                  self.tayyor = os.path.exists(manba("ovoz", "salom.mp3"))
                  threading.Thread(target=self._ish, daemon=True).start()

              def gapir(self, kalitlar):
                  if not self.tayyor:
                      try:
                          import winsound
                          winsound.MessageBeep()
                      except Exception:
                          pass
                      return
                  for k in kalitlar:
                      yol = manba("ovoz", f"{k}.mp3")
                      if os.path.exists(yol):
                          self.band.set()
                          self.navbat.put(yol)

              def _ish(self):
                  import ctypes
                  winmm = ctypes.windll.winmm

                  def mci(buyruq):
                      winmm.mciSendStringW(buyruq, None, 0, 0)

                  while True:
                      yol = self.navbat.get()
                      self.band.set()
                      try:
                          mci("close yjavob")
                          mci(f'open "{yol}" type mpegvideo alias yjavob')
                          mci("play yjavob wait")
                          mci("close yjavob")
                      except Exception:
                          pass
                      if self.navbat.empty():
                          time.sleep(0.35)       # aks-sado mikrofonga tushmasin
                          if self.navbat.empty():
                              self.band.clear()


          # ------------------------------------------------------------------ Windows bilan birga ishga tushish
          RUN_KALIT = r"Software\Microsoft\Windows\CurrentVersion\Run"


          def autostart_holati():
              try:
                  import winreg
                  with winreg.OpenKey(winreg.HKEY_CURRENT_USER, RUN_KALIT) as k:
                      winreg.QueryValueEx(k, ILOVA_NOMI)
                      return True
              except Exception:
                  return False


          def autostart_qoy(yoq):
              if not getattr(sys, "frozen", False):
                  return
              import winreg
              with winreg.OpenKey(winreg.HKEY_CURRENT_USER, RUN_KALIT, 0, winreg.KEY_SET_VALUE) as k:
                  if yoq:
                      winreg.SetValueEx(k, ILOVA_NOMI, 0, winreg.REG_SZ, f'"{sys.executable}"')
                  else:
                      try:
                          winreg.DeleteValue(k, ILOVA_NOMI)
                      except FileNotFoundError:
                          pass


          # ------------------------------------------------------------------ asosiy dastur
          class Yordamchi:
              def __init__(self):
                  self.ovoz = Ovoz()
                  self.yoqilgan = True
                  self.ishla = True
                  self.kutish_gacha = 0.0
                  self.holat = "Yuklanmoqda..."
                  self.belgi = None

              # --- tray ---
              def rasm(self, rang):
                  from PIL import Image, ImageDraw
                  img = Image.new("RGBA", (64, 64), (0, 0, 0, 0))
                  d = ImageDraw.Draw(img)
                  d.ellipse((2, 2, 62, 62), fill=rang)
                  d.rounded_rectangle((25, 12, 39, 38), radius=7, fill="white")
                  d.arc((17, 20, 47, 46), 0, 180, fill="white", width=4)
                  d.line((32, 46, 32, 53), fill="white", width=4)
                  d.line((24, 54, 40, 54), fill="white", width=4)
                  return img

              def holatni_qoy(self, matn, rang=None):
                  self.holat = matn
                  if self.belgi is not None:
                      self.belgi.title = f"{ILOVA_NOMI}: {matn}"
                      if rang:
                          self.belgi.icon = self.rasm(rang)
                      try:
                          self.belgi.update_menu()
                      except Exception:
                          pass

              def tray(self):
                  import pystray
                  from pystray import MenuItem as M

                  def almashtir(icon, item):
                      self.yoqilgan = not self.yoqilgan
                      if self.yoqilgan:
                          self.holatni_qoy('Tinglayapman — "Yordamchi" deng', "#2EC4B6")
                      else:
                          self.holatni_qoy("To'xtatilgan", "#8FA3B8")

                  def autostart(icon, item):
                      autostart_qoy(not autostart_holati())

                  def chiqish(icon, item):
                      self.ishla = False
                      icon.stop()

                  menyu = pystray.Menu(
                      M(lambda item: self.holat, None, enabled=False),
                      pystray.Menu.SEPARATOR,
                      M("Tinglash yoqilgan", almashtir, checked=lambda item: self.yoqilgan),
                      M("Windows bilan birga ishga tushsin", autostart, checked=lambda item: autostart_holati()),
                      pystray.Menu.SEPARATOR,
                      M("Chiqish", chiqish),
                  )
                  self.belgi = pystray.Icon(ILOVA_NOMI, self.rasm("#F4B740"), f"{ILOVA_NOMI}: yuklanmoqda", menyu)
                  self.belgi.run(setup=self._setup)

              def _setup(self, icon):
                  icon.visible = True
                  threading.Thread(target=self.tinglash, daemon=True).start()

              # --- tinglash ---
              def tinglash(self):
                  import sounddevice as sd
                  from vosk import Model, KaldiRecognizer, SetLogLevel
                  SetLogLevel(-1)
                  model = Model(manba("model-uz"))
                  salomlashdi = False
                  while self.ishla:
                      try:
                          rec = KaldiRecognizer(model, 16000)
                          q = queue.Queue()

                          def cb(indata, frames, vaqt, status):
                              q.put(bytes(indata))

                          with sd.RawInputStream(samplerate=16000, blocksize=8000, dtype="int16",
                                                 channels=1, callback=cb):
                              self.holatni_qoy('Tinglayapman — "Yordamchi" deng', "#2EC4B6")
                              if not salomlashdi:
                                  salomlashdi = True
                                  self.ovoz.gapir(["salom_pc"])
                              while self.ishla:
                                  data = q.get()
                                  if self.ovoz.band.is_set() or not self.yoqilgan:
                                      continue
                                  if rec.AcceptWaveform(data):
                                      self.ishlov(json.loads(rec.Result()).get("text", ""))
                      except Exception as e:
                          self.holatni_qoy(f"Mikrofon topilmadi, qayta urinilmoqda...", "#F4B740")
                          time.sleep(5)

              def ishlov(self, matn):
                  toza = normalize(matn)
                  if not toza:
                      return
                  sozlar = toza.split()
                  idx = next((i for i, w in enumerate(sozlar) if w.startswith("yordamch")), -1)
                  hozir = time.monotonic()
                  if idx >= 0:
                      qolgan = " ".join(sozlar[idx + 1:])
                      if not qolgan:
                          self.kutish_gacha = hozir + 9
                          self.ovoz.gapir([f"eshit_{random.randint(0, 2)}"])
                          self.holatni_qoy("Eshitaman...", "#3DDC97")
                          return
                      self.buyruq(qolgan)
                  elif hozir < self.kutish_gacha:
                      self.kutish_gacha = 0
                      self.buyruq(toza)

              def buyruq(self, matn):
                  ok, xabar, ovozlar = bajar(matn)
                  self.ovoz.gapir(ovozlar)
                  self.holatni_qoy(xabar, "#2EC4B6")


          def yagona_nusxa():
              """Dastur ikki marta ochilib qolmasligi uchun"""
              import ctypes
              ctypes.windll.kernel32.CreateMutexW(None, False, "Global\\UzYordamchiMutex")
              return ctypes.windll.kernel32.GetLastError() != 183


          def main():
              if not yagona_nusxa():
                  return
              # birinchi ishga tushishda Windows bilan birga yoqiladigan qilib qo'yamiz
              try:
                  if getattr(sys, "frozen", False) and not autostart_holati():
                      autostart_qoy(True)
              except Exception:
                  pass
              Yordamchi().tray()


          if __name__ == "__main__":
              main()
          YORDAMCHI_EOF
          cat > ovozlar.py <<'OVOZ_EOF'
          # O'zbekcha javob ovozlarini yaratadi (Microsoft neyron ovozi, edge-tts orqali)
          import asyncio, os, edge_tts

          OVOZ = os.environ.get("OVOZ", "uz-UZ-SardorNeural")
          OUT = os.environ.get("OUT", "app/src/main/assets/ovoz")
          os.makedirs(OUT, exist_ok=True)

          GAPLAR = {
              "salom": "Assalomu alaykum! Men tayyorman. Kerak bo'lsam, Yordamchi deb chaqiring.",
              "eshit_0": "Labbay?",
              "eshit_1": "Ha, eshitaman.",
              "eshit_2": "Buyuring.",
              "tushunmadim": "Kechirasiz, tushunmadim. Qaytadan ayting.",
              "xato": "Kechirasiz, buni bajara olmadim.",
              "musiqa": "Xo'p, musiqani yoqdim.",
              "toxtat": "Musiqa to'xtatildi.",
              "keyingi": "Keyingi qo'shiq.",
              "oldingi": "Oldingi qo'shiq.",
              "ovoz_oshir": "Ovozni balandlatdim.",
              "ovoz_pasayt": "Ovozni pasaytirdim.",
              "ovoz_ochir": "Ovoz o'chirildi.",
              "ovoz_yoq": "Ovoz yoqildi.",
              "yol": "Xo'p, yo'lni ochyapman.",
              "navigator": "Navigator ochildi.",
              "navigator_yoq": "Kechirasiz, navigator ilovasi topilmadi.",
              "qongiroq": "Xo'p, qo'ng'iroq qilyapman.",
              "kimga": "Kimga qo'ng'iroq qilay?",
              "kontakt_yoq": "Kechirasiz, bunday kontakt topilmadi.",
              "ruxsat_yoq": "Buning uchun menga ruxsat berilmagan.",
              "ilova_och": "Ilova ochildi.",
              "ilova_yoq": "Kechirasiz, bunday ilova topilmadi.",
              "qaysi_ilova": "Qaysi ilovani ochay?",
              "rahmat": "Arzimaydi! Har doim xizmatingizdaman.",
              "qalay": "Yaxshi, rahmat! Sizga qanday yordam bera olaman?",
              "kimsan": "Men sizning shaxsiy yordamchingizman. Musiqa, yo'l, qo'ng'iroq va ilovalarni boshqara olaman.",
          }

          # --- kompyuter uchun qo'shimcha javoblar ---
          GAPLAR.update({
              "salom_pc": "Assalomu alaykum! Kompyuter yordamchisi tayyor. Kerak bo'lsam, Yordamchi deb chaqiring.",
              "kimsan_pc": "Men sizning kompyuter yordamchingizman. Ilovalar, musiqa, ovoz va internetni boshqara olaman.",
              "pauza_pc": "Bajarildi.",
              "youtube": "YouTube ochildi.",
              "qidir": "Xo'p, internetdan qidiryapman.",
              "nima_qidir": "Nimani qidiray?",
              "papka": "Papka ochildi.",
              "oyna_yop": "Oyna yopildi.",
              "ish_stoli": "Mana, ish stoli.",
              "skrinshot": "Ekran rasmi olindi.",
              "pc_qulf": "Kompyuter qulflandi.",
              "pc_ochir": "Kompyuter bir daqiqadan keyin o'chadi. To'xtatish uchun, bekor qil, deng.",
              "pc_qayta": "Kompyuter bir daqiqadan keyin qayta yonadi. To'xtatish uchun, bekor qil, deng.",
              "bekor": "Bekor qilindi.",
              "pc_uyqu": "Kompyuter uxlash rejimiga o'tyapti. Xayr!",
          })

          BIRLAR = ["", "bir", "ikki", "uch", "to'rt", "besh", "olti", "yetti", "sakkiz", "to'qqiz"]
          ONLAR = ["", "o'n", "yigirma", "o'ttiz", "qirq", "ellik"]

          def son(n):
              if n == 0:
                  return "nol"
              o, b = divmod(n, 10)
              return " ".join(x for x in (ONLAR[o], BIRLAR[b]) if x)

          for h in range(24):
              GAPLAR[f"soat_{h}"] = f"Hozir soat {son(h)} bo'ldi."
              GAPLAR[f"soatdan_{h}"] = f"Hozir soat {son(h)}dan"
          for m in range(1, 60):
              GAPLAR[f"daq_{m}"] = f"{son(m)} daqiqa o'tdi."

          async def bitta(kalit, matn, sem):
              async with sem:
                  for urinish in range(4):
                      try:
                          await edge_tts.Communicate(matn, OVOZ, rate="+5%").save(f"{OUT}/{kalit}.mp3")
                          return True
                      except Exception as e:
                          print(f"{kalit}: {e} (qayta urinish)")
                          await asyncio.sleep(2 + urinish * 2)
                  return False

          async def main():
              sem = asyncio.Semaphore(6)
              natija = await asyncio.gather(*(bitta(k, t, sem) for k, t in GAPLAR.items()))
              print(f"Tayyor: {sum(natija)} / {len(GAPLAR)} ta ovoz")
              if not os.path.exists(f"{OUT}/salom.mp3"):
                  raise SystemExit("salom.mp3 yaratilmadi")

          asyncio.run(main())
          OVOZ_EOF
          cat > belgi.py <<'BELGI_EOF'
          from PIL import Image, ImageDraw
          img = Image.new("RGBA", (256, 256), (0, 0, 0, 0))
          d = ImageDraw.Draw(img)
          d.ellipse((8, 8, 248, 248), fill="#1B8F8A")
          d.rounded_rectangle((100, 48, 156, 152), radius=28, fill="white")
          d.arc((68, 80, 188, 184), 0, 180, fill="white", width=16)
          d.line((128, 184, 128, 212), fill="white", width=16)
          d.line((96, 216, 160, 216), fill="white", width=16)
          img.save("yordamchi.ico", sizes=[(16, 16), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)])
          BELGI_EOF

      - name: Kutubxonalarni o'rnatish
        run: pip install vosk==0.3.45 sounddevice pystray pillow pyinstaller edge-tts

      - name: O'zbekcha ovoz tanish modelini yuklash
        run: |
          curl -sSL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-uz-0.22.zip
          python -c "import zipfile; zipfile.ZipFile('model.zip').extractall('.')"
          mv vosk-model-small-uz-0.22 model-uz

      - name: O'zbekcha javob ovozlarini yaratish (Sardor)
        continue-on-error: true
        env:
          OVOZ: uz-UZ-SardorNeural
          OUT: ovoz
        run: python ovozlar.py

      - name: EXE yig'ish
        run: |
          mkdir -p ovoz
          python belgi.py
          pyinstaller --noconfirm --onefile --noconsole --name Yordamchi --icon yordamchi.ico --add-data "model-uz;model-uz" --add-data "ovoz;ovoz" --collect-all vosk --collect-all sounddevice --hidden-import pystray._win32 yordamchi.py

      - uses: actions/upload-artifact@v4
        with:
          name: Yordamchi-EXE
          path: dist/Yordamchi.exe
