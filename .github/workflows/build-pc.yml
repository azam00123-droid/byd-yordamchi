          cat > app/src/main/java/uz/byd/yordamchi/Dizayn.kt <<'YORDAMCHI_EOF'
          package uz.byd.yordamchi

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.RadialGradient
          import android.graphics.RectF
          import android.graphics.Shader
          import android.view.View
          import android.view.ViewGroup
          import android.view.animation.LinearInterpolator
          import kotlin.math.max
          import kotlin.math.min

          /** Ilova ranglari — mashina ekrani uchun qorong'i, ko'zni charchatmaydigan palitra */
          object Rang {
              val FON = Color.parseColor("#0E1A2B")
              val YUZA = Color.parseColor("#16263D")
              val YUZA2 = Color.parseColor("#1F3350")
              val CHIZIQ = Color.parseColor("#2A4163")
              val MATN = Color.parseColor("#EAF2FA")
              val XIRA = Color.parseColor("#8FA3B8")
              val AKSENT = Color.parseColor("#2EC4B6")
              val TAYYOR = Color.parseColor("#3DDC97")
              val OGOH = Color.parseColor("#F4B740")

              fun ochroq(c: Int, k: Float): Int {
                  val r = Color.red(c) + ((255 - Color.red(c)) * k).toInt()
                  val g = Color.green(c) + ((255 - Color.green(c)) * k).toInt()
                  val b = Color.blue(c) + ((255 - Color.blue(c)) * k).toInt()
                  return Color.rgb(r, g, b)
              }
          }

          /** Markazdagi jonli mikrofon: tinglayotganda to'lqinlar tarqaladi */
          class OrbView(ctx: Context) : View(ctx) {

              var bosqich: Int = 0
                  set(v) { if (field != v) { field = v; invalidate() } }

              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val d = resources.displayMetrics.density
              private var faza = 0f
              private val anim = ValueAnimator.ofFloat(0f, 1f).apply {
                  duration = 2400
                  repeatCount = ValueAnimator.INFINITE
                  interpolator = LinearInterpolator()
                  addUpdateListener { faza = it.animatedValue as Float; if (bosqich > 0) invalidate() }
              }

              override fun onAttachedToWindow() { super.onAttachedToWindow(); anim.start() }
              override fun onDetachedFromWindow() { anim.cancel(); super.onDetachedFromWindow() }

              override fun onDraw(c: Canvas) {
                  val cx = width / 2f
                  val cy = height / 2f
                  val r = min(width, height) / 2f
                  val core = r * 0.46f
                  val asosiy = when (bosqich) {
                      0 -> Rang.XIRA
                      1 -> Rang.OGOH
                      3 -> Rang.TAYYOR
                      else -> Rang.AKSENT
                  }

                  // tarqaluvchi to'lqinlar
                  if (bosqich > 0) {
                      val tezlik = if (bosqich == 3) 2f else 1f
                      p.style = Paint.Style.STROKE
                      p.strokeWidth = 2f * d
                      for (i in 0..2) {
                          val f = (faza * tezlik + i / 3f) % 1f
                          p.color = asosiy
                          p.alpha = ((1f - f) * 140).toInt()
                          c.drawCircle(cx, cy, core + (r - core) * f, p)
                      }
                  }

                  // yumshoq nur
                  p.style = Paint.Style.FILL
                  p.shader = null
                  p.color = asosiy
                  p.alpha = 45
                  c.drawCircle(cx, cy, core * 1.22f, p)

                  // asosiy doira
                  p.alpha = 255
                  p.shader = RadialGradient(
                      cx, cy - core * 0.4f, core * 1.3f,
                      Rang.ochroq(asosiy, 0.35f), asosiy, Shader.TileMode.CLAMP
                  )
                  c.drawCircle(cx, cy, core, p)
                  p.shader = null

                  // mikrofon belgisi
                  p.color = Rang.FON
                  val w = core * 0.34f
                  val h = core * 0.62f
                  val top = cy - h * 0.62f
                  c.drawRoundRect(RectF(cx - w / 2, top, cx + w / 2, top + h * 0.82f), w / 2, w / 2, p)
                  p.style = Paint.Style.STROKE
                  p.strokeWidth = core * 0.075f
                  p.strokeCap = Paint.Cap.ROUND
                  val arcR = w * 0.95f
                  val arcY = top + h * 0.82f - w / 2
                  c.drawArc(RectF(cx - arcR, arcY - arcR, cx + arcR, arcY + arcR), 0f, 180f, false, p)
                  val oyoq = arcY + arcR
                  c.drawLine(cx, oyoq, cx, oyoq + core * 0.16f, p)
                  c.drawLine(cx - w * 0.55f, oyoq + core * 0.16f, cx + w * 0.55f, oyoq + core * 0.16f, p)
              }
          }

          /** Tugmalarni qatorma-qator, sig'magani keyingi qatorga o'tkazib joylaydi */
          class FlowLayout(ctx: Context, private val oraliq: Int) : ViewGroup(ctx) {

              override fun onMeasure(widthMeasureSpec: Int, heightMeasureSpec: Int) {
                  val maxW = MeasureSpec.getSize(widthMeasureSpec) - paddingLeft - paddingRight
                  var x = 0
                  var y = 0
                  var qatorH = 0
                  for (i in 0 until childCount) {
                      val ch = getChildAt(i)
                      if (ch.visibility == GONE) continue
                      measureChild(
                          ch,
                          MeasureSpec.makeMeasureSpec(maxW, MeasureSpec.AT_MOST),
                          MeasureSpec.makeMeasureSpec(0, MeasureSpec.UNSPECIFIED)
                      )
                      if (x > 0 && x + ch.measuredWidth > maxW) {
                          x = 0; y += qatorH + oraliq; qatorH = 0
                      }
                      x += ch.measuredWidth + oraliq
                      qatorH = max(qatorH, ch.measuredHeight)
                  }
                  setMeasuredDimension(
                      MeasureSpec.getSize(widthMeasureSpec),
                      y + qatorH + paddingTop + paddingBottom
                  )
              }

              override fun onLayout(changed: Boolean, l: Int, t: Int, r: Int, b: Int) {
                  val maxW = r - l - paddingLeft - paddingRight
                  var x = 0
                  var y = 0
                  var qatorH = 0
                  for (i in 0 until childCount) {
                      val ch = getChildAt(i)
                      if (ch.visibility == GONE) continue
                      if (x > 0 && x + ch.measuredWidth > maxW) {
                          x = 0; y += qatorH + oraliq; qatorH = 0
                      }
                      ch.layout(
                          paddingLeft + x, paddingTop + y,
                          paddingLeft + x + ch.measuredWidth, paddingTop + y + ch.measuredHeight
                      )
                      x += ch.measuredWidth + oraliq
                      qatorH = max(qatorH, ch.measuredHeight)
                  }
              }
          }
          YORDAMCHI_EOF
          cat > app/src/main/java/uz/byd/yordamchi/Ovoz.kt <<'YORDAMCHI_EOF'
          package uz.byd.yordamchi

          import android.content.Context
          import android.media.AudioAttributes
          import android.media.AudioFocusRequest
          import android.media.AudioManager
          import android.media.MediaPlayer
          import android.os.Build
          import android.os.Handler
          import android.os.Looper

          /**
           * Oldindan tayyorlangan o'zbekcha ovozli javoblarni (assets/ovoz papkasidagi mp3 fayllar) ijro etadi.
           * Gapirayotganda musiqa ovozini pasaytiradi va mikrofonni vaqtincha to'xtatadi.
           */
          class Ovoz(private val ctx: Context) {

              /** true — gapirishni boshladi, false — tugatdi */
              var gapirayotganda: ((Boolean) -> Unit)? = null

              private val audio = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
              private val handler = Handler(Looper.getMainLooper())
              private val navbat = ArrayDeque<String>()
              private var player: MediaPlayer? = null
              private var fokus: AudioFocusRequest? = null
              private val attrs = AudioAttributes.Builder()
                  .setUsage(AudioAttributes.USAGE_MEDIA)
                  .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                  .build()

              /** Ovoz fayllari APK ichida bormi */
              val tayyor: Boolean = bor("salom")

              fun bor(kalit: String): Boolean = try {
                  ctx.assets.openFd("ovoz/$kalit.mp3").close(); true
              } catch (e: Exception) { false }

              fun gapir(kalitlar: List<String>) {
                  handler.post {
                      toxtatIchki()
                      val mavjud = kalitlar.filter { bor(it) }
                      if (mavjud.isEmpty()) { tugadi(); return@post }
                      navbat.addAll(mavjud)
                      fokusOl()
                      gapirayotganda?.invoke(true)
                      keyingi()
                  }
              }

              fun yop() {
                  handler.removeCallbacksAndMessages(null)
                  toxtatIchki()
                  fokusQaytar()
              }

              private fun keyingi() {
                  val k = navbat.removeFirstOrNull()
                  if (k == null) { tugadi(); return }
                  try {
                      val afd = ctx.assets.openFd("ovoz/$k.mp3")
                      val mp = MediaPlayer()
                      mp.setAudioAttributes(attrs)
                      mp.setDataSource(afd.fileDescriptor, afd.startOffset, afd.length)
                      afd.close()
                      mp.setOnCompletionListener {
                          it.release(); if (player === it) player = null; keyingi()
                      }
                      mp.setOnErrorListener { m, _, _ ->
                          m.release(); if (player === m) player = null; keyingi(); true
                      }
                      mp.prepare()
                      player = mp
                      mp.start()
                  } catch (e: Exception) {
                      keyingi()
                  }
              }

              private fun toxtatIchki() {
                  navbat.clear()
                  player?.let { try { it.stop() } catch (e: Exception) {}; it.release() }
                  player = null
              }

              private fun tugadi() {
                  fokusQaytar()
                  // aks-sado mikrofonga tushmasligi uchun biroz kutamiz
                  handler.postDelayed({
                      if (player == null && navbat.isEmpty()) gapirayotganda?.invoke(false)
                  }, 350)
              }

              @Suppress("DEPRECATION")
              private fun fokusOl() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      val r = AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN_TRANSIENT_MAY_DUCK)
                          .setAudioAttributes(attrs).build()
                      fokus = r
                      audio.requestAudioFocus(r)
                  } else {
                      audio.requestAudioFocus(null, AudioManager.STREAM_MUSIC, AudioManager.AUDIOFOCUS_GAIN_TRANSIENT_MAY_DUCK)
                  }
              }

              @Suppress("DEPRECATION")
              private fun fokusQaytar() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      fokus?.let { audio.abandonAudioFocusRequest(it) }
                      fokus = null
                  } else {
                      audio.abandonAudioFocus(null)
                  }
              }
          }
          YORDAMCHI_EOF
          cat > app/src/main/java/uz/byd/yordamchi/VoiceService.kt <<'YORDAMCHI_EOF'
          package uz.byd.yordamchi

          import android.Manifest
          import android.app.AlarmManager
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.media.AudioManager
          import android.media.ToneGenerator
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.SystemClock
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import org.json.JSONObject
          import org.vosk.Model
          import org.vosk.Recognizer
          import org.vosk.android.RecognitionListener
          import org.vosk.android.SpeechService
          import org.vosk.android.StorageService
          import java.io.IOException
          import java.util.Random

          /** Fonda doim tinglab turadigan xizmat. "Yordamchi" so'zini eshitsa buyruqni bajaradi. */
          class VoiceService : Service(), RecognitionListener {

              companion object {
                  private const val KANAL = "yordamchi"
                  private const val NOTIF_ID = 1
                  const val TEKSHIR = "uz.byd.yordamchi.TEKSHIR"
                  private const val SALOM_ORALIGI = 20 * 60 * 1000L   // 20 daqiqada bir martadan ko'p salomlashmaydi
                  @Volatile var holat: String = "To'xtagan"
                  /** 0 — o'chiq, 1 — yuklanmoqda, 2 — tinglayapti, 3 — buyruq kutyapti */
                  @Volatile var bosqich: Int = 0

                  fun start(ctx: Context) {
                      try {
                          ContextCompat.startForegroundService(ctx, Intent(ctx, VoiceService::class.java))
                      } catch (e: Exception) { /* tizim ruxsat bermadi — qo'riqchi keyinroq qayta urinadi */ }
                  }
              }

              private var model: Model? = null
              private var speech: SpeechService? = null
              private lateinit var buyruqlar: CommandProcessor
              private lateinit var ovoz: Ovoz
              private var kutishGacha = 0L
              private val handler = Handler(Looper.getMainLooper())
              private val tone by lazy { ToneGenerator(AudioManager.STREAM_MUSIC, 90) }
              private val tasodif = Random()
              private var qabulQilgich = false

              /** Mashina uyqudan uyg'onib, ekran yonganda */
              private val ekranQabul = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent) {
                      if (model != null) {
                          tinglashniBoshla()
                          salomlash()
                      }
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  oldingaChiqar("Yuklanmoqda...")
                  buyruqlar = CommandProcessor(this)
                  ovoz = Ovoz(this)
                  ovoz.gapirayotganda = { band -> speech?.setPause(band) }
                  qoriqchiniRejala()

                  try {
                      registerReceiver(ekranQabul, IntentFilter().apply {
                          addAction(Intent.ACTION_SCREEN_ON)
                          addAction(Intent.ACTION_USER_PRESENT)
                      })
                      qabulQilgich = true
                  } catch (e: Exception) {}

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                      != PackageManager.PERMISSION_GRANTED
                  ) {
                      yangila("Mikrofon ruxsati yo'q. Ilovani ochib ruxsat bering.")
                      stopSelf()
                      return
                  }

                  StorageService.unpack(this, "model-uz", "model",
                      { m: Model ->
                          model = m
                          tinglashniBoshla()
                          salomlash()
                      },
                      { e: IOException -> yangila("Model yuklanmadi: ${e.message}") })
              }

              private fun tinglashniBoshla() {
                  try {
                      speech?.stop()
                      speech?.shutdown()
                      val rec = Recognizer(model, 16000f)
                      speech = SpeechService(rec, 16000f).also { it.startListening(this) }
                      bosqich = 2
                      yangila("Tinglayapman. \"Yordamchi\" deb chaqiring")
                  } catch (e: Exception) {
                      yangila("Mikrofon xatosi: ${e.message}")
                      handler.postDelayed({ tinglashniBoshla() }, 3000)
                  }
              }

              private fun salomlash() {
                  val p = getSharedPreferences("yordamchi", MODE_PRIVATE)
                  val hozir = System.currentTimeMillis()
                  if (hozir - p.getLong("oxirgi_salom", 0L) < SALOM_ORALIGI) return
                  p.edit().putLong("oxirgi_salom", hozir).apply()
                  if (ovoz.tayyor) ovoz.gapir(listOf("salom"))
                  else tone.startTone(ToneGenerator.TONE_PROP_ACK, 300)
              }

              /** Har 15 daqiqada tekshirib turadi: xizmat o'lgan bo'lsa qayta tiriltiradi */
              private fun qoriqchiniRejala() {
                  try {
                      val pi = PendingIntent.getBroadcast(
                          this, 7,
                          Intent(this, BootReceiver::class.java).setAction(TEKSHIR),
                          PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                      )
                      getSystemService(AlarmManager::class.java).setInexactRepeating(
                          AlarmManager.ELAPSED_REALTIME_WAKEUP,
                          SystemClock.elapsedRealtime() + AlarmManager.INTERVAL_FIFTEEN_MINUTES,
                          AlarmManager.INTERVAL_FIFTEEN_MINUTES, pi
                      )
                  } catch (e: Exception) {}
              }

              override fun onTaskRemoved(rootIntent: Intent?) {
                  // Ilova ro'yxatdan surib yopilsa ham 3 soniyadan keyin qayta ishga tushadi
                  try {
                      val pi = PendingIntent.getBroadcast(
                          this, 8,
                          Intent(this, BootReceiver::class.java).setAction(TEKSHIR),
                          PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                      )
                      getSystemService(AlarmManager::class.java)
                          .set(AlarmManager.ELAPSED_REALTIME_WAKEUP, SystemClock.elapsedRealtime() + 3000, pi)
                  } catch (e: Exception) {}
                  super.onTaskRemoved(rootIntent)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_STICKY
              override fun onBind(intent: Intent?): IBinder? = null

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  if (qabulQilgich) try { unregisterReceiver(ekranQabul) } catch (e: Exception) {}
                  speech?.stop()
                  speech?.shutdown()
                  if (::ovoz.isInitialized) ovoz.yop()
                  holat = "To'xtagan"
                  bosqich = 0
                  super.onDestroy()
              }

              // ---- Vosk natijalari ----
              override fun onResult(hypothesis: String?) = ishlov(hypothesis)
              override fun onFinalResult(hypothesis: String?) = ishlov(hypothesis)
              override fun onPartialResult(hypothesis: String?) {}
              override fun onTimeout() { tinglashniBoshla() }
              override fun onError(exception: Exception?) {
                  yangila("Xato: ${exception?.message}. Qayta urinilmoqda...")
                  handler.postDelayed({ tinglashniBoshla() }, 3000)
              }

              private fun ishlov(json: String?) {
                  if (json.isNullOrBlank()) return
                  val matn = try { JSONObject(json).optString("text") } catch (e: Exception) { "" }
                  val toza = CommandProcessor.normalize(matn)
                  if (toza.isBlank()) return

                  val sozlar = toza.split(" ")
                  val chaqiruv = sozlar.indexOfFirst { it.startsWith("yordamch") }
                  val hozir = SystemClock.elapsedRealtime()

                  when {
                      chaqiruv >= 0 -> {
                          val qolgan = sozlar.drop(chaqiruv + 1).joinToString(" ")
                          if (qolgan.isBlank()) {
                              kutishGacha = hozir + 9000
                              bosqich = 3
                              handler.postDelayed({ if (bosqich == 3) bosqich = 2 }, 9000)
                              if (ovoz.tayyor) ovoz.gapir(listOf("eshit_${tasodif.nextInt(3)}"))
                              else tone.startTone(ToneGenerator.TONE_PROP_BEEP, 200)
                              yangila("Eshitaman...")
                          } else bajar(qolgan)
                      }
                      hozir < kutishGacha -> { kutishGacha = 0; bajar(toza) }
                  }
              }

              private fun bajar(buyruq: String) {
                  bosqich = 2
                  val n = buyruqlar.execute(buyruq)
                  if (ovoz.tayyor) ovoz.gapir(n.ovozlar)
                  else tone.startTone(if (n.ok) ToneGenerator.TONE_PROP_ACK else ToneGenerator.TONE_PROP_NACK, 250)
                  yangila(n.matn)
              }

              // ---- Bildirishnoma ----
              private fun bildirishnoma(matn: String): Notification {
                  val nm = getSystemService(NotificationManager::class.java)
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(
                          NotificationChannel(KANAL, "Yordamchi", NotificationManager.IMPORTANCE_LOW)
                      )
                  }
                  val pi = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  return NotificationCompat.Builder(this, KANAL)
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentTitle("BYD Yordamchi")
                      .setContentText(matn)
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .build()
              }

              private fun oldingaChiqar(matn: String) {
                  holat = matn
                  bosqich = 1
                  val n = bildirishnoma(matn)
                  if (Build.VERSION.SDK_INT >= 30) {
                      startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  } else {
                      startForeground(NOTIF_ID, n)
                  }
              }

              private fun yangila(matn: String) {
                  holat = matn
                  getSystemService(NotificationManager::class.java).notify(NOTIF_ID, bildirishnoma(matn))
              }
          }
