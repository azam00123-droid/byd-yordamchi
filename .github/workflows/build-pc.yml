          package uz.byd.yordamchi

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          /**
           * Mashina yoqilganda, Bluetooth ulanganda va har 15 daqiqada (qo'riqchi)
           * yordamchi ishlayotganini tekshiradi va kerak bo'lsa qayta ishga tushiradi.
