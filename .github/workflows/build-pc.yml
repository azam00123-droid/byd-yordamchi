          package uz.byd.yordamchi

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.AudioManager
          import android.net.Uri
          import android.provider.ContactsContract
          import android.view.KeyEvent
          import androidx.core.content.ContextCompat
          import java.util.Calendar
          import java.util.Locale

          /** O'zbekcha buyruqlarni tushunib, bajaradi. */
          class CommandProcessor(private val ctx: Context) {

              /** ok — bajarildimi, matn — ekranda ko'rinadi, ovozlar — assets/ovoz ichidagi javob fayllari */
              data class Natija(val ok: Boolean, val matn: String, val ovozlar: List<String>)

              companion object {
                  const val YANDEX_NAVI = "ru.yandex.yandexnavi"
                  const val YANDEX_MAPS = "ru.yandex.yandexmaps"
                  const val GOOGLE_MAPS = "com.google.android.apps.maps"

                  private val KERAKSIZ = setOf(
                      "menga", "iltimos", "ni", "ga", "ilova", "dastur", "yordamchi",
                      "bilan", "uchun", "hozir", "qil", "ber"
                  )
                  private val QOSHIMCHALAR = listOf("ning", "gacha", "dan", "ga", "ka", "qa", "ni", "da", "ta")

                  private val KIRILL = mapOf(
                      'а' to "a", 'б' to "b", 'в' to "v", 'г' to "g", 'д' to "d", 'е' to "e", 'ё' to "yo",
                      'ж' to "j", 'з' to "z", 'и' to "i", 'й' to "y", 'к' to "k", 'л' to "l", 'м' to "m",
                      'н' to "n", 'о' to "o", 'п' to "p", 'р' to "r", 'с' to "s", 'т' to "t", 'у' to "u",
                      'ф' to "f", 'х' to "x", 'ц' to "s", 'ч' to "ch", 'ш' to "sh", 'щ' to "sh", 'ъ' to "",
                      'ы' to "i", 'ь' to "", 'э' to "e", 'ю' to "yu", 'я' to "ya", 'ў' to "o", 'қ' to "q",
                      'ғ' to "g", 'ҳ' to "h"
                  )

                  /** Kichik harf, apostroflarsiz, kirill -> lotin. "Qo'ng'iroq" -> "qongiroq" */
                  fun normalize(s: String): String {
                      val sb = StringBuilder()
                      for (ch in s.lowercase(Locale.ROOT)) sb.append(KIRILL[ch] ?: ch.toString())
                      return sb.toString()
                          .replace(Regex("[‘’ʻʼ`'´]"), "")
                          .replace(Regex("[^a-z0-9 ]"), " ")
                          .replace(Regex("\\s+"), " ")
                          .trim()
                  }
              }

              private val audio = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
              private val pm: PackageManager = ctx.packageManager
              fun execute(raw: String): Natija {
                  val t = normalize(raw)
                  if (t.isBlank()) return Natija(false, "Bo'sh buyruq", listOf("tushunmadim"))
                  return when {
                      has(t, "soat necha", "soat nechi", "vaqt necha", "hozir soat") -> vaqt()
                      has(t, "ovozni ochir", "ovozsiz") ->
                          ovozBir(AudioManager.ADJUST_MUTE, "Ovoz o'chirildi", "ovoz_ochir")
                      has(t, "ovozni yoq", "ovozni qaytar") ->
                          ovozBir(AudioManager.ADJUST_UNMUTE, "Ovoz yoqildi", "ovoz_yoq")
                      has(t, "ovozni oshir", "balandroq", "baland qil", "kuchaytir", "ovozni kotar") ->
                          ovoz(AudioManager.ADJUST_RAISE, "Ovoz oshirildi", "ovoz_oshir")
                      has(t, "ovozni pasayt", "pastroq", "past qil", "sekinroq") ->
                          ovoz(AudioManager.ADJUST_LOWER, "Ovoz pasaytirildi", "ovoz_pasayt")
                      has(t, "keyingi", "boshqa qoshiq", "boshqasini") ->
                          media(KeyEvent.KEYCODE_MEDIA_NEXT, "Keyingi qo'shiq", "keyingi")
                      has(t, "oldingi", "avvalgi") ->
                          media(KeyEvent.KEYCODE_MEDIA_PREVIOUS, "Oldingi qo'shiq", "oldingi")
                      has(t, "toxtat", "pauza", "jim bol") ->
                          media(KeyEvent.KEYCODE_MEDIA_PAUSE, "To'xtatildi", "toxtat")
                      has(t, "musiqa", "qoshiq", "davom et") ->
                          media(KeyEvent.KEYCODE_MEDIA_PLAY, "Musiqa yoqildi", "musiqa")
                      has(t, "qongiroq", "qongroq", "telefon qil", "chaqir") -> qongiroq(t)
                      has(t, "olib bor", "yol korsat", "boramiz", "boraman", "borish", "navigator", "manzil", "marshrut") -> yol(t)
                      Regex("\\boch(ib ber)?\\b").containsMatchIn(t) -> ilovaOch(t)
                      has(t, "rahmat", "raxmat", "tashakkur") -> Natija(true, "Arzimaydi!", listOf("rahmat"))
                      has(t, "qalaysan", "yaxshimisan", "salom", "assalomu") ->
                          Natija(true, "Yaxshi, rahmat!", listOf("qalay"))
                      has(t, "kimsan", "isming nima", "nima qila olasan") ->
                          Natija(true, "Men sizning yordamchingizman", listOf("kimsan"))
                      else -> Natija(false, "Tushunmadim: $raw", listOf("tushunmadim"))
                  }
              }

              private fun has(t: String, vararg k: String) = k.any { t.contains(it) }

              // ---- Vaqt ----
              private fun vaqt(): Natija {
                  val c = Calendar.getInstance()
                  val h = c.get(Calendar.HOUR_OF_DAY)
                  val m = c.get(Calendar.MINUTE)
                  val s = String.format(Locale.ROOT, "%02d:%02d", h, m)
                  val ovozlar = if (m == 0) listOf("soat_$h") else listOf("soatdan_$h", "daq_$m")
                  return Natija(true, "Soat $s", ovozlar)
              }

              // ---- Ovoz va musiqa ----
              private fun ovoz(dir: Int, msg: String, javob: String): Natija {
                  repeat(3) { audio.adjustStreamVolume(AudioManager.STREAM_MUSIC, dir, AudioManager.FLAG_SHOW_UI) }
                  return Natija(true, msg, listOf(javob))
              }

              private fun ovozBir(dir: Int, msg: String, javob: String): Natija {
                  audio.adjustStreamVolume(AudioManager.STREAM_MUSIC, dir, AudioManager.FLAG_SHOW_UI)
                  return Natija(true, msg, listOf(javob))
              }

              private fun media(code: Int, msg: String, javob: String): Natija {
                  audio.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, code))
                  audio.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_UP, code))
                  return Natija(true, msg, listOf(javob))
              }

              // ---- Qo'ng'iroq ----
              private fun qongiroq(t: String): Natija {
                  val ism = maqsad(t, listOf("qongiroq qil", "qongiroq", "qongroq", "telefon qil", "chaqir"))
                  if (ism.isBlank()) return Natija(false, "Kimga qo'ng'iroq qilay?", listOf("kimga"))
                  if (!ruxsat(Manifest.permission.READ_CONTACTS)) return Natija(false, "Kontaktlarga ruxsat berilmagan", listOf("ruxsat_yoq"))
                  val raqam = kontaktTop(ism) ?: return Natija(false, "\"$ism\" kontakti topilmadi", listOf("kontakt_yoq"))
                  val action = if (ruxsat(Manifest.permission.CALL_PHONE)) Intent.ACTION_CALL else Intent.ACTION_DIAL
                  return och(Intent(action, Uri.parse("tel:" + Uri.encode(raqam))), "$ism ga qo'ng'iroq qilinmoqda", "qongiroq")
              }

              private fun kontaktTop(ism: String): String? {
                  val royxat = mutableListOf<Pair<String, String>>()
                  ctx.contentResolver.query(
                      ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                      arrayOf(
                          ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                          ContactsContract.CommonDataKinds.Phone.NUMBER
                      ), null, null, null
                  )?.use { c ->
                      while (c.moveToNext()) {
                          val n = normalize(c.getString(0) ?: continue)
                          val num = c.getString(1) ?: continue
                          royxat.add(n to num)
                      }
                  }
                  return royxat.firstOrNull { it.first == ism }?.second
                      ?: royxat.firstOrNull { it.first.split(" ").contains(ism) }?.second
                      ?: royxat.firstOrNull { it.first.contains(ism) }?.second
              }

              // ---- Navigatsiya ----
              private fun yol(t: String): Natija {
                  val joy = maqsad(
                      t, listOf(
                          "olib bor", "yol korsat", "boramiz", "boraman", "borish", "navigator",
                          "manzil", "marshrut", "qanday", "yol", "och"
                      )
                  )
                  if (joy.isBlank()) {
                      for (p in listOf(YANDEX_NAVI, YANDEX_MAPS, GOOGLE_MAPS)) {
                          pm.getLaunchIntentForPackage(p)?.let { return och(it, "Navigator ochildi", "navigator") }
                      }
                      return Natija(false, "Navigator topilmadi", listOf("navigator_yoq"))
                  }
                  val variantlar = listOf(
                      Intent(Intent.ACTION_VIEW, Uri.parse("yandexnavi://map_search?text=" + Uri.encode(joy))).setPackage(YANDEX_NAVI),
                      Intent(Intent.ACTION_VIEW, Uri.parse("yandexmaps://maps.yandex.ru/?text=" + Uri.encode(joy))).setPackage(YANDEX_MAPS),
                      Intent(Intent.ACTION_VIEW, Uri.parse("geo:0,0?q=" + Uri.encode(joy)))
                  )
                  for (i in variantlar) if (i.resolveActivity(pm) != null) return och(i, "Yo'l: $joy", "yol")
                  return Natija(false, "Xarita ilovasi topilmadi", listOf("navigator_yoq"))
              }

              // ---- Ilova ochish ----
              private fun ilovaOch(t: String): Natija {
                  val nom = maqsad(t, listOf("ochib ber", "och", "ilovasini", "ilovani", "dasturini", "dasturni"))
                  if (nom.isBlank()) return Natija(false, "Qaysi ilovani ochay?", listOf("qaysi_ilova"))
                  val apps = pm.queryIntentActivities(
                      Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0
                  )
                  val nomlar = apps.map { normalize(it.loadLabel(pm).toString()) to it.activityInfo.packageName }
                  val pkg = nomlar.firstOrNull { it.first == nom }?.second
                      ?: nomlar.firstOrNull { it.first.contains(nom) }?.second
                      ?: nomlar.firstOrNull { it.first.length >= 3 && nom.contains(it.first) }?.second
                      ?: return Natija(false, "\"$nom\" ilovasi topilmadi", listOf("ilova_yoq"))
                  val i = pm.getLaunchIntentForPackage(pkg) ?: return Natija(false, "Ochib bo'lmadi", listOf("xato"))
                  return och(i, "$nom ochildi", "ilova_och")
              }

              // ---- Yordamchi funksiyalar ----
              /** Buyruqdan kalit so'zlarni olib tashlab, nishonni qoldiradi: "akamga qongiroq qil" -> "akam" */
              private fun maqsad(t: String, kalitlar: List<String>): String {
                  var s = t
                  for (k in kalitlar) s = s.replace(Regex("\\b" + Regex.escape(k) + "\\b"), " ")
                  val sozlar = s.split(" ").map { it.trim() }
                      .filter { it.isNotEmpty() && it !in KERAKSIZ }.toMutableList()
                  if (sozlar.isEmpty()) return ""
                  val oxirgi = sozlar.last()
                  val q = QOSHIMCHALAR.firstOrNull { oxirgi.length > it.length + 2 && oxirgi.endsWith(it) }
                  if (q != null) sozlar[sozlar.size - 1] = oxirgi.dropLast(q.length)
                  return sozlar.joinToString(" ")
              }

              private fun ruxsat(p: String) =
                  ContextCompat.checkSelfPermission(ctx, p) == PackageManager.PERMISSION_GRANTED

              private fun och(i: Intent, msg: String, javob: String): Natija = try {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  ctx.startActivity(i)
                  Natija(true, msg, listOf(javob))
              } catch (e: Exception) {
                  Natija(false, "Xato: ${e.message}", listOf("xato"))
              }
          }
