                      inputType = InputType.TYPE_CLASS_TEXT
                      imeOptions = EditorInfo.IME_ACTION_GO
                      background = fon(Rang.YUZA, 16, Rang.CHIZIQ)
                      setPadding(dp(18), dp(14), dp(18), dp(14))
                  }
                  val yubor = asosiyTugma("Sinash") { sina(kirish.text.toString()) }
                  kirish.setOnEditorActionListener { _, _, _ -> sina(kirish.text.toString()); true }
                  qator.addView(kirish, lp(0, WC, 1f))
                  qator.addView(yubor, lp(WC, WC).apply { leftMargin = dp(10) })
                  addView(qator, lp(MP, WC))

                  natijaMatn = matn("", 15f, Rang.XIRA).apply { visibility = View.GONE }
                  addView(natijaMatn, lp(MP, WC).apply { topMargin = dp(10) })
              }

              private fun boLimSarlavha(s: String, izoh: String?): View = LinearLayout(this).apply {
                  orientation = LinearLayout.VERTICAL
                  setPadding(dp(4), 0, dp(4), dp(12))
                  addView(matn(s, 20f, shrift = ORTA))
                  if (izoh != null) addView(matn(izoh, 14f, Rang.XIRA), lp(MP, WC).apply { topMargin = dp(2) })
              }

              private fun ajratgich() = View(this).apply {
                  setBackgroundColor(Rang.CHIZIQ)
                  layoutParams = lp(MP, dp(1)).apply { leftMargin = dp(66) }
              }

              private fun qadamQator(
                  raqam: Int, sarlavha: String, izoh: String,
                  tekshir: () -> Boolean, tugmaMatni: (Boolean) -> String, amal: () -> Unit
              ): View {
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(16), dp(16), dp(16), dp(16))
                  }
                  val belgi = matn("$raqam", 15f, shrift = ORTA).apply { gravity = Gravity.CENTER }
                  row.addView(belgi, lp(dp(34), dp(34)))
                  val matnlar = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  matnlar.addView(matn(sarlavha, 17f, shrift = ORTA))
                  matnlar.addView(matn(izoh, 13f, Rang.XIRA), lp(MP, WC).apply { topMargin = dp(2) })
                  row.addView(matnlar, lp(0, WC, 1f).apply { leftMargin = dp(16); rightMargin = dp(12) })
                  val tugma = matn("", 15f, shrift = ORTA).apply {
                      gravity = Gravity.CENTER
                      setPadding(dp(18), dp(11), dp(18), dp(11))
                      setOnClickListener { amal() }
                  }
                  row.addView(tugma, lp(WC, WC))
                  qadamlar.add(Qadam(belgi, tugma, raqam, tekshir, tugmaMatni))
                  return row
              }

              private fun asosiyTugma(s: String, amal: () -> Unit) = matn(s, 16f, Rang.FON, ORTA).apply {
                  gravity = Gravity.CENTER
                  background = fon(Rang.AKSENT, 16)
                  setPadding(dp(24), dp(14), dp(24), dp(14))
                  setOnClickListener { amal() }
              }

              private fun chip(s: String) = matn(s, 15f, Rang.MATN).apply {
                  background = fon(Rang.YUZA2, 20)
                  setPadding(dp(16), dp(10), dp(16), dp(10))
                  setOnClickListener { sina(s) }
              }

              // ---------- holat ----------
              private fun holatniYangila() {
                  val b = VoiceService.bosqich
                  orb.bosqich = b
                  holatSarlavha.text = when (b) {
                      0 -> "O'chiq"
                      1 -> "Tayyorlanmoqda…"
                      3 -> "Eshitaman…"
                      else -> "Tinglayapman"
                  }
                  holatSarlavha.setTextColor(
                      when (b) { 0 -> Rang.XIRA; 1 -> Rang.OGOH; 3 -> Rang.TAYYOR; else -> Rang.MATN }
                  )
                  holatMatn.text = if (b == 0) "Yoqish uchun mikrofonni bosing" else VoiceService.holat

                  for (q in qadamlar) {
                      val bajarildi = q.tekshir()
                      q.belgi.text = if (bajarildi) "✓" else "${q.raqam}"
                      q.belgi.setTextColor(if (bajarildi) Rang.FON else Rang.XIRA)
                      q.belgi.background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          if (bajarildi) setColor(Rang.TAYYOR) else { setColor(Rang.YUZA); setStroke(dp(2), Rang.CHIZIQ) }
                      }
                      q.tugma.text = q.tugmaMatni(bajarildi)
                      if (bajarildi) {
                          q.tugma.setTextColor(Rang.XIRA)
                          q.tugma.background = fon(Rang.YUZA2, 14)
                      } else {
                          q.tugma.setTextColor(Rang.FON)
                          q.tugma.background = fon(Rang.AKSENT, 14)
                      }
                  }
              }

              override fun onResume() { super.onResume(); handler.post(yangilash) }
              override fun onPause() { handler.removeCallbacks(yangilash); super.onPause() }
              override fun onDestroy() { sinovOvoz?.yop(); super.onDestroy() }

              // ---------- amallar ----------
              private fun sina(buyruq: String) {
                  if (buyruq.isBlank()) return
                  val p = sinov ?: CommandProcessor(this).also { sinov = it }
                  val n = p.execute(buyruq)
                  (sinovOvoz ?: Ovoz(this).also { sinovOvoz = it }).gapir(n.ovozlar)
                  natijaMatn.visibility = View.VISIBLE
                  natijaMatn.text = (if (n.ok) "✓  " else "✕  ") + n.matn
                  natijaMatn.setTextColor(if (n.ok) Rang.TAYYOR else Rang.OGOH)
              }

              private fun xizmatniAlmashtir() {
                  if (VoiceService.bosqich >= 1) {
                      stopService(Intent(this, VoiceService::class.java))
                  } else if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      ruxsatSora()
                  } else {
                      VoiceService.start(this)
                  }
              }

              private fun ruxsatSora() {
                  val r = mutableListOf(
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.READ_CONTACTS,
                      Manifest.permission.CALL_PHONE
                  )
                  if (Build.VERSION.SDK_INT >= 33) r.add(Manifest.permission.POST_NOTIFICATIONS)
                  requestPermissions(r.toTypedArray(), 1)
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int, permissions: Array<out String>, grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                      VoiceService.start(this)
                  } else {
                      Toast.makeText(this, "Mikrofonsiz ishlay olmayman", Toast.LENGTH_LONG).show()
                  }
                  holatniYangila()
              }

              private fun batareya() {
                  if (getSystemService(PowerManager::class.java).isIgnoringBatteryOptimizations(packageName)) return
                  try {
                      startActivity(
                          Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:$packageName"))
                      )
                  } catch (e: Exception) {
                      Toast.makeText(this, "Sozlamalar → Batareya bo'limidan qo'lda o'chiring", Toast.LENGTH_LONG).show()
                  }
              }

              private fun overlayRuxsati() {
                  if (Settings.canDrawOverlays(this)) return
                  try {
                      startActivity(
                          Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                      )
                  } catch (e: Exception) {
                      Toast.makeText(this, "Sozlamalardan qo'lda yoqing", Toast.LENGTH_LONG).show()
                  }
              }
          }
          YORDAMCHI_EOF

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: O'zbekcha ovoz tanish modelini yuklash
        run: |
          wget -q https://alphacephei.com/vosk/models/vosk-model-small-uz-0.22.zip
          unzip -q vosk-model-small-uz-0.22.zip
          rm -rf app/src/main/assets/model-uz
          mv vosk-model-small-uz-0.22 app/src/main/assets/model-uz
          cat /proc/sys/kernel/random/uuid > app/src/main/assets/model-uz/uuid

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: O'zbekcha javob ovozlarini yaratish (Sardor)
        continue-on-error: true
        env:
          OVOZ: uz-UZ-SardorNeural
        run: |
          pip install -q edge-tts
          cat > ovozlar.py <<'PYEOF'
          # O'zbekcha javob ovozlarini yaratadi (Microsoft neyron ovozi, edge-tts orqali)
          import asyncio, os, edge_tts

          OVOZ = os.environ.get("OVOZ", "uz-UZ-SardorNeural")
          OUT = "app/src/main/assets/ovoz"
          os.makedirs(OUT, exist_ok=True)

          GAPLAR = {
              "salom": "Assalomu alaykum! Men tayyorman. Kerak bo'lsam, Yordamchi deb chaqiring.",
              "eshit_0": "Labbay?",
              "eshit_1": "Ha, eshitaman.",
              "eshit_2": "Buyuring.",
              "tushunmadim": "Kechirasiz, tushunmadim. Qaytadan ayting.",
              "xato": "Kechirasiz, buni bajara olmadim.",
              "musiqa": "Xo'p, musiqani yoqdim.",
              "toxtat": "Musiqa to'xtatildi.",
              "keyingi": "Keyingi qo'shiq.",
              "oldingi": "Oldingi qo'shiq.",
              "ovoz_oshir": "Ovozni balandlatdim.",
              "ovoz_pasayt": "Ovozni pasaytirdim.",
              "ovoz_ochir": "Ovoz o'chirildi.",
              "ovoz_yoq": "Ovoz yoqildi.",
              "yol": "Xo'p, yo'lni ochyapman.",
              "navigator": "Navigator ochildi.",
              "navigator_yoq": "Kechirasiz, navigator ilovasi topilmadi.",
              "qongiroq": "Xo'p, qo'ng'iroq qilyapman.",
              "kimga": "Kimga qo'ng'iroq qilay?",
              "kontakt_yoq": "Kechirasiz, bunday kontakt topilmadi.",
              "ruxsat_yoq": "Buning uchun menga ruxsat berilmagan.",
              "ilova_och": "Ilova ochildi.",
              "ilova_yoq": "Kechirasiz, bunday ilova topilmadi.",
              "qaysi_ilova": "Qaysi ilovani ochay?",
              "rahmat": "Arzimaydi! Har doim xizmatingizdaman.",
              "qalay": "Yaxshi, rahmat! Sizga qanday yordam bera olaman?",
              "kimsan": "Men sizning shaxsiy yordamchingizman. Musiqa, yo'l, qo'ng'iroq va ilovalarni boshqara olaman.",
          }

          BIRLAR = ["", "bir", "ikki", "uch", "to'rt", "besh", "olti", "yetti", "sakkiz", "to'qqiz"]
          ONLAR = ["", "o'n", "yigirma", "o'ttiz", "qirq", "ellik"]

          def son(n):
              if n == 0:
                  return "nol"
              o, b = divmod(n, 10)
              return " ".join(x for x in (ONLAR[o], BIRLAR[b]) if x)

          for h in range(24):
              GAPLAR[f"soat_{h}"] = f"Hozir soat {son(h)} bo'ldi."
              GAPLAR[f"soatdan_{h}"] = f"Hozir soat {son(h)}dan"
          for m in range(1, 60):
              GAPLAR[f"daq_{m}"] = f"{son(m)} daqiqa o'tdi."

          async def bitta(kalit, matn, sem):
              async with sem:
                  for urinish in range(4):
                      try:
                          await edge_tts.Communicate(matn, OVOZ, rate="+5%").save(f"{OUT}/{kalit}.mp3")
                          return True
                      except Exception as e:
                          print(f"{kalit}: {e} (qayta urinish)")
                          await asyncio.sleep(2 + urinish * 2)
                  return False

          async def main():
              sem = asyncio.Semaphore(6)
              natija = await asyncio.gather(*(bitta(k, t, sem) for k, t in GAPLAR.items()))
              print(f"Tayyor: {sum(natija)} / {len(GAPLAR)} ta ovoz")
              if not os.path.exists(f"{OUT}/salom.mp3"):
                  raise SystemExit("salom.mp3 yaratilmadi")

          asyncio.run(main())
          PYEOF
          python ovozlar.py
          ls app/src/main/assets/ovoz | wc -l

      - name: APK yig'ish
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: BYD-Yordamchi-APK
          path: app/build/outputs/apk/debug/*.apk
