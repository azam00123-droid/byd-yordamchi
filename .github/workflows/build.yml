      - name: O'zbekcha ovoz tanish modelini yuklash
        run: |
          wget -q https://alphacephei.com/vosk/models/vosk-model-small-uz-0.22.zip
          unzip -q vosk-model-small-uz-0.22.zip
          rm -rf app/src/main/assets/model-uz
          mv vosk-model-small-uz-0.22 app/src/main/assets/model-uz
