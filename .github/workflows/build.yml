name: APK yasash

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Loyiha fayllarini yaratish
        run: |
          mkdir -p app/src/main/java/uz/byd/yordamchi app/src/main/assets
          cat > settings.gradle.kts <<'YORDAMCHI_EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "BydYordamchi"
          include(":app")
          YORDAMCHI_EOF
          cat > build.gradle.kts <<'YORDAMCHI_EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          YORDAMCHI_EOF
          cat > gradle.properties <<'YORDAMCHI_EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx3g
          kotlin.code.style=official
          YORDAMCHI_EOF
          cat > app/build.gradle.kts <<'YORDAMCHI_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "uz.byd.yordamchi"
              compileSdk = 34
              defaultConfig {
                  applicationId = "uz.byd.yordamchi"
                  minSdk = 24
                  targetSdk = 29   // BYD DiLink (Android 10) uchun eng qulay
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              lint { abortOnError = false; checkReleaseBuilds = false }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("com.alphacephei:vosk-android:0.3.47@aar")
              implementation("net.java.dev.jna:jna:5.13.0@aar")
          }
          YORDAMCHI_EOF
          cat > app/src/main/AndroidManifest.xml <<'YORDAMCHI_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />

              <application
                  android:label="BYD Yordamchi"
                  android:icon="@android:drawable/ic_btn_speak_now"
                  android:theme="@android:style/Theme.DeviceDefault">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".VoiceService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />

                  <receiver android:name=".BootReceiver" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.bluetooth.device.action.ACL_CONNECTED" />
                          <action android:name="android.bluetooth.a2dp.profile.action.CONNECTION_STATE_CHANGED" />
                          <action android:name="android.bluetooth.headset.profile.action.CONNECTION_STATE_CHANGED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          YORDAMCHI_EOF
          cat > app/src/main/java/uz/byd/yordamchi/BootReceiver.kt <<'YORDAMCHI_EOF'
          package uz.byd.yordamchi

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          /**
           * Mashina yoqilganda, Bluetooth ulanganda va har 15 daqiqada (qo'riqchi)
           * yordamchi ishlayotganini tekshiradi va kerak bo'lsa qayta ishga tushiradi.
           */
          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  VoiceService.start(context)
              }
          }
          YORDAMCHI_EOF
          cat > app/src/main/java/uz/byd/yordamchi/Ovoz.kt <<'YORDAMCHI_EOF'
          package uz.byd.yordamchi

          import android.content.Context
          import android.media.AudioAttributes
          import android.media.AudioFocusRequest
          import android.media.AudioManager
          import android.media.MediaPlayer
          import android.os.Build
          import android.os.Handler
          import android.os.Looper

          /**
           * Oldindan tayyorlangan o'zbekcha ovozli javoblarni (assets/ovoz/*.mp3) ijro etadi.
           * Gapirayotganda musiqa ovozini pasaytiradi va mikrofonni vaqtincha to'xtatadi.
           */
          class Ovoz(private val ctx: Context) {

              /** true — gapirishni boshladi, false — tugatdi */
              var gapirayotganda: ((Boolean) -> Unit)? = null

              private val audio = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
              private val handler = Handler(Looper.getMainLooper())
              private val navbat = ArrayDeque<String>()
              private var player: MediaPlayer? = null
              private var fokus: AudioFocusRequest? = null
              private val attrs = AudioAttributes.Builder()
                  .setUsage(AudioAttributes.USAGE_MEDIA)
                  .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                  .build()

              /** Ovoz fayllari APK ichida bormi */
              val tayyor: Boolean = bor("salom")

              fun bor(kalit: String): Boolean = try {
                  ctx.assets.openFd("ovoz/$kalit.mp3").close(); true
              } catch (e: Exception) { false }

              fun gapir(kalitlar: List<String>) {
                  handler.post {
                      toxtatIchki()
                      val mavjud = kalitlar.filter { bor(it) }
                      if (mavjud.isEmpty()) { tugadi(); return@post }
                      navbat.addAll(mavjud)
                      fokusOl()
                      gapirayotganda?.invoke(true)
                      keyingi()
                  }
              }

              fun yop() {
                  handler.removeCallbacksAndMessages(null)
                  toxtatIchki()
                  fokusQaytar()
              }

              private fun keyingi() {
                  val k = navbat.removeFirstOrNull()
                  if (k == null) { tugadi(); return }
                  try {
                      val afd = ctx.assets.openFd("ovoz/$k.mp3")
                      val mp = MediaPlayer()
                      mp.setAudioAttributes(attrs)
                      mp.setDataSource(afd.fileDescriptor, afd.startOffset, afd.length)
                      afd.close()
                      mp.setOnCompletionListener {
                          it.release(); if (player === it) player = null; keyingi()
                      }
                      mp.setOnErrorListener { m, _, _ ->
                          m.release(); if (player === m) player = null; keyingi(); true
                      }
                      mp.prepare()
                      player = mp
                      mp.start()
                  } catch (e: Exception) {
                      keyingi()
                  }
              }

              private fun toxtatIchki() {
                  navbat.clear()
                  player?.let { try { it.stop() } catch (_: Exception) {}; it.release() }
                  player = null
              }

              private fun tugadi() {
                  fokusQaytar()
                  // aks-sado mikrofonga tushmasligi uchun biroz kutamiz
                  handler.postDelayed({
                      if (player == null && navbat.isEmpty()) gapirayotganda?.invoke(false)
                  }, 350)
              }

              @Suppress("DEPRECATION")
              private fun fokusOl() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      val r = AudioFocusRequest.Builder(AudioManager.AUDIOFOCUS_GAIN_TRANSIENT_MAY_DUCK)
                          .setAudioAttributes(attrs).build()
                      fokus = r
                      audio.requestAudioFocus(r)
                  } else {
                      audio.requestAudioFocus(null, AudioManager.STREAM_MUSIC, AudioManager.AUDIOFOCUS_GAIN_TRANSIENT_MAY_DUCK)
                  }
              }

              @Suppress("DEPRECATION")
              private fun fokusQaytar() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      fokus?.let { audio.abandonAudioFocusRequest(it) }
                      fokus = null
                  } else {
                      audio.abandonAudioFocus(null)
                  }
              }
          }
          YORDAMCHI_EOF
          cat > app/src/main/java/uz/byd/yordamchi/VoiceService.kt <<'YORDAMCHI_EOF'
          package uz.byd.yordamchi

          import android.Manifest
          import android.app.AlarmManager
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.media.AudioManager
          import android.media.ToneGenerator
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.SystemClock
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import org.json.JSONObject
          import org.vosk.Model
          import org.vosk.Recognizer
          import org.vosk.android.RecognitionListener
          import org.vosk.android.SpeechService
          import org.vosk.android.StorageService
          import java.io.IOException
          import java.util.Random

          /** Fonda doim tinglab turadigan xizmat. "Yordamchi" so'zini eshitsa buyruqni bajaradi. */
          class VoiceService : Service(), RecognitionListener {

              companion object {
                  private const val KANAL = "yordamchi"
                  private const val NOTIF_ID = 1
                  const val TEKSHIR = "uz.byd.yordamchi.TEKSHIR"
                  private const val SALOM_ORALIGI = 20 * 60 * 1000L   // 20 daqiqada bir martadan ko'p salomlashmaydi
                  @Volatile var holat: String = "To'xtagan"

                  fun start(ctx: Context) {
                      try {
                          ContextCompat.startForegroundService(ctx, Intent(ctx, VoiceService::class.java))
                      } catch (e: Exception) { /* tizim ruxsat bermadi — qo'riqchi keyinroq qayta urinadi */ }
                  }
              }

              private var model: Model? = null
              private var speech: SpeechService? = null
              private lateinit var buyruqlar: CommandProcessor
              private lateinit var ovoz: Ovoz
              private var kutishGacha = 0L
              private val handler = Handler(Looper.getMainLooper())
              private val tone by lazy { ToneGenerator(AudioManager.STREAM_MUSIC, 90) }
              private val tasodif = Random()
              private var qabulQilgich = false

              /** Mashina uyqudan uyg'onib, ekran yonganda */
              private val ekranQabul = object : BroadcastReceiver() {
                  override fun onReceive(c: Context, i: Intent) {
                      if (model != null) {
                          tinglashniBoshla()
                          salomlash()
                      }
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  oldingaChiqar("Yuklanmoqda...")
                  buyruqlar = CommandProcessor(this)
                  ovoz = Ovoz(this)
                  ovoz.gapirayotganda = { band -> speech?.setPause(band) }
                  qoriqchiniRejala()

                  try {
                      registerReceiver(ekranQabul, IntentFilter().apply {
                          addAction(Intent.ACTION_SCREEN_ON)
                          addAction(Intent.ACTION_USER_PRESENT)
                      })
                      qabulQilgich = true
                  } catch (_: Exception) {}

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO)
                      != PackageManager.PERMISSION_GRANTED
                  ) {
                      yangila("Mikrofon ruxsati yo'q. Ilovani ochib ruxsat bering.")
                      stopSelf()
                      return
                  }

                  StorageService.unpack(this, "model-uz", "model",
                      { m: Model ->
                          model = m
                          tinglashniBoshla()
                          salomlash()
                      },
                      { e: IOException -> yangila("Model yuklanmadi: ${e.message}") })
              }

              private fun tinglashniBoshla() {
                  try {
                      speech?.stop()
                      speech?.shutdown()
                      val rec = Recognizer(model, 16000f)
                      speech = SpeechService(rec, 16000f).also { it.startListening(this) }
                      yangila("Tinglayapman. \"Yordamchi\" deb chaqiring")
                  } catch (e: Exception) {
                      yangila("Mikrofon xatosi: ${e.message}")
                      handler.postDelayed({ tinglashniBoshla() }, 3000)
                  }
              }

              private fun salomlash() {
                  val p = getSharedPreferences("yordamchi", MODE_PRIVATE)
                  val hozir = System.currentTimeMillis()
                  if (hozir - p.getLong("oxirgi_salom", 0L) < SALOM_ORALIGI) return
                  p.edit().putLong("oxirgi_salom", hozir).apply()
                  if (ovoz.tayyor) ovoz.gapir(listOf("salom"))
                  else tone.startTone(ToneGenerator.TONE_PROP_ACK, 300)
              }

              /** Har 15 daqiqada tekshirib turadi: xizmat o'lgan bo'lsa qayta tiriltiradi */
              private fun qoriqchiniRejala() {
                  try {
                      val pi = PendingIntent.getBroadcast(
                          this, 7,
                          Intent(this, BootReceiver::class.java).setAction(TEKSHIR),
                          PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                      )
                      getSystemService(AlarmManager::class.java).setInexactRepeating(
                          AlarmManager.ELAPSED_REALTIME_WAKEUP,
                          SystemClock.elapsedRealtime() + AlarmManager.INTERVAL_FIFTEEN_MINUTES,
                          AlarmManager.INTERVAL_FIFTEEN_MINUTES, pi
                      )
                  } catch (_: Exception) {}
              }

              override fun onTaskRemoved(rootIntent: Intent?) {
                  // Ilova ro'yxatdan surib yopilsa ham 3 soniyadan keyin qayta ishga tushadi
                  try {
                      val pi = PendingIntent.getBroadcast(
                          this, 8,
                          Intent(this, BootReceiver::class.java).setAction(TEKSHIR),
                          PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                      )
                      getSystemService(AlarmManager::class.java)
                          .set(AlarmManager.ELAPSED_REALTIME_WAKEUP, SystemClock.elapsedRealtime() + 3000, pi)
                  } catch (_: Exception) {}
                  super.onTaskRemoved(rootIntent)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_STICKY
              override fun onBind(intent: Intent?): IBinder? = null

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  if (qabulQilgich) try { unregisterReceiver(ekranQabul) } catch (_: Exception) {}
                  speech?.stop()
                  speech?.shutdown()
                  if (::ovoz.isInitialized) ovoz.yop()
                  holat = "To'xtagan"
                  super.onDestroy()
              }

              // ---- Vosk natijalari ----
              override fun onResult(hypothesis: String?) = ishlov(hypothesis)
              override fun onFinalResult(hypothesis: String?) = ishlov(hypothesis)
              override fun onPartialResult(hypothesis: String?) {}
              override fun onTimeout() { tinglashniBoshla() }
              override fun onError(exception: Exception?) {
                  yangila("Xato: ${exception?.message}. Qayta urinilmoqda...")
                  handler.postDelayed({ tinglashniBoshla() }, 3000)
              }

              private fun ishlov(json: String?) {
                  if (json.isNullOrBlank()) return
                  val matn = try { JSONObject(json).optString("text") } catch (e: Exception) { "" }
                  val toza = CommandProcessor.normalize(matn)
                  if (toza.isBlank()) return

                  val sozlar = toza.split(" ")
                  val chaqiruv = sozlar.indexOfFirst { it.startsWith("yordamch") }
                  val hozir = SystemClock.elapsedRealtime()

                  when {
                      chaqiruv >= 0 -> {
                          val qolgan = sozlar.drop(chaqiruv + 1).joinToString(" ")
                          if (qolgan.isBlank()) {
                              kutishGacha = hozir + 9000
                              if (ovoz.tayyor) ovoz.gapir(listOf("eshit_${tasodif.nextInt(3)}"))
                              else tone.startTone(ToneGenerator.TONE_PROP_BEEP, 200)
                              yangila("Eshitaman...")
                          } else bajar(qolgan)
                      }
                      hozir < kutishGacha -> { kutishGacha = 0; bajar(toza) }
                  }
              }

              private fun bajar(buyruq: String) {
                  val n = buyruqlar.execute(buyruq)
                  if (ovoz.tayyor) ovoz.gapir(n.ovozlar)
                  else tone.startTone(if (n.ok) ToneGenerator.TONE_PROP_ACK else ToneGenerator.TONE_PROP_NACK, 250)
                  yangila(n.matn)
              }

              // ---- Bildirishnoma ----
              private fun bildirishnoma(matn: String): Notification {
                  val nm = getSystemService(NotificationManager::class.java)
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(
                          NotificationChannel(KANAL, "Yordamchi", NotificationManager.IMPORTANCE_LOW)
                      )
                  }
                  val pi = PendingIntent.getActivity(
                      this, 0, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE
                  )
                  return NotificationCompat.Builder(this, KANAL)
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentTitle("BYD Yordamchi")
                      .setContentText(matn)
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .build()
              }

              private fun oldingaChiqar(matn: String) {
                  holat = matn
                  val n = bildirishnoma(matn)
                  if (Build.VERSION.SDK_INT >= 30) {
                      startForeground(NOTIF_ID, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  } else {
                      startForeground(NOTIF_ID, n)
                  }
              }

              private fun yangila(matn: String) {
                  holat = matn
                  getSystemService(NotificationManager::class.java).notify(NOTIF_ID, bildirishnoma(matn))
              }
          }
          YORDAMCHI_EOF
          cat > app/src/main/java/uz/byd/yordamchi/CommandProcessor.kt <<'YORDAMCHI_EOF'
          package uz.byd.yordamchi

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.AudioManager
          import android.net.Uri
          import android.provider.ContactsContract
          import android.view.KeyEvent
          import androidx.core.content.ContextCompat
          import java.util.Calendar
          import java.util.Locale

          /** O'zbekcha buyruqlarni tushunib, bajaradi. */
          class CommandProcessor(private val ctx: Context) {

              /** ok — bajarildimi, matn — ekranda ko'rinadi, ovozlar — assets/ovoz ichidagi javob fayllari */
              data class Natija(val ok: Boolean, val matn: String, val ovozlar: List<String>)

              companion object {
                  const val YANDEX_NAVI = "ru.yandex.yandexnavi"
                  const val YANDEX_MAPS = "ru.yandex.yandexmaps"
                  const val GOOGLE_MAPS = "com.google.android.apps.maps"

                  private val KERAKSIZ = setOf(
                      "menga", "iltimos", "ni", "ga", "ilova", "dastur", "yordamchi",
                      "bilan", "uchun", "hozir", "qil", "ber"
                  )
                  private val QOSHIMCHALAR = listOf("ning", "gacha", "dan", "ga", "ka", "qa", "ni", "da", "ta")

                  private val KIRILL = mapOf(
                      'а' to "a", 'б' to "b", 'в' to "v", 'г' to "g", 'д' to "d", 'е' to "e", 'ё' to "yo",
                      'ж' to "j", 'з' to "z", 'и' to "i", 'й' to "y", 'к' to "k", 'л' to "l", 'м' to "m",
                      'н' to "n", 'о' to "o", 'п' to "p", 'р' to "r", 'с' to "s", 'т' to "t", 'у' to "u",
                      'ф' to "f", 'х' to "x", 'ц' to "s", 'ч' to "ch", 'ш' to "sh", 'щ' to "sh", 'ъ' to "",
                      'ы' to "i", 'ь' to "", 'э' to "e", 'ю' to "yu", 'я' to "ya", 'ў' to "o", 'қ' to "q",
                      'ғ' to "g", 'ҳ' to "h"
                  )

                  /** Kichik harf, apostroflarsiz, kirill -> lotin. "Qo'ng'iroq" -> "qongiroq" */
                  fun normalize(s: String): String {
                      val sb = StringBuilder()
                      for (ch in s.lowercase(Locale.ROOT)) sb.append(KIRILL[ch] ?: ch.toString())
                      return sb.toString()
                          .replace(Regex("[‘’ʻʼ`'´]"), "")
                          .replace(Regex("[^a-z0-9 ]"), " ")
                          .replace(Regex("\\s+"), " ")
                          .trim()
                  }
              }

              private val audio = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
              private val pm: PackageManager = ctx.packageManager
              fun execute(raw: String): Natija {
                  val t = normalize(raw)
                  if (t.isBlank()) return Natija(false, "Bo'sh buyruq", listOf("tushunmadim"))
                  return when {
                      has(t, "soat necha", "soat nechi", "vaqt necha", "hozir soat") -> vaqt()
                      has(t, "ovozni ochir", "ovozsiz") ->
                          ovozBir(AudioManager.ADJUST_MUTE, "Ovoz o'chirildi", "ovoz_ochir")
                      has(t, "ovozni yoq", "ovozni qaytar") ->
                          ovozBir(AudioManager.ADJUST_UNMUTE, "Ovoz yoqildi", "ovoz_yoq")
                      has(t, "ovozni oshir", "balandroq", "baland qil", "kuchaytir", "ovozni kotar") ->
                          ovoz(AudioManager.ADJUST_RAISE, "Ovoz oshirildi", "ovoz_oshir")
                      has(t, "ovozni pasayt", "pastroq", "past qil", "sekinroq") ->
                          ovoz(AudioManager.ADJUST_LOWER, "Ovoz pasaytirildi", "ovoz_pasayt")
                      has(t, "keyingi", "boshqa qoshiq", "boshqasini") ->
                          media(KeyEvent.KEYCODE_MEDIA_NEXT, "Keyingi qo'shiq", "keyingi")
                      has(t, "oldingi", "avvalgi") ->
                          media(KeyEvent.KEYCODE_MEDIA_PREVIOUS, "Oldingi qo'shiq", "oldingi")
                      has(t, "toxtat", "pauza", "jim bol") ->
                          media(KeyEvent.KEYCODE_MEDIA_PAUSE, "To'xtatildi", "toxtat")
                      has(t, "musiqa", "qoshiq", "davom et") ->
                          media(KeyEvent.KEYCODE_MEDIA_PLAY, "Musiqa yoqildi", "musiqa")
                      has(t, "qongiroq", "qongroq", "telefon qil", "chaqir") -> qongiroq(t)
                      has(t, "olib bor", "yol korsat", "boramiz", "boraman", "borish", "navigator", "manzil", "marshrut") -> yol(t)
                      Regex("\\boch(ib ber)?\\b").containsMatchIn(t) -> ilovaOch(t)
                      has(t, "rahmat", "raxmat", "tashakkur") -> Natija(true, "Arzimaydi!", listOf("rahmat"))
                      has(t, "qalaysan", "yaxshimisan", "salom", "assalomu") ->
                          Natija(true, "Yaxshi, rahmat!", listOf("qalay"))
                      has(t, "kimsan", "isming nima", "nima qila olasan") ->
                          Natija(true, "Men sizning yordamchingizman", listOf("kimsan"))
                      else -> Natija(false, "Tushunmadim: $raw", listOf("tushunmadim"))
                  }
              }

              private fun has(t: String, vararg k: String) = k.any { t.contains(it) }

              // ---- Vaqt ----
              private fun vaqt(): Natija {
                  val c = Calendar.getInstance()
                  val h = c.get(Calendar.HOUR_OF_DAY)
                  val m = c.get(Calendar.MINUTE)
                  val s = String.format(Locale.ROOT, "%02d:%02d", h, m)
                  val ovozlar = if (m == 0) listOf("soat_$h") else listOf("soatdan_$h", "daq_$m")
                  return Natija(true, "Soat $s", ovozlar)
              }

              // ---- Ovoz va musiqa ----
              private fun ovoz(dir: Int, msg: String, javob: String): Natija {
                  repeat(3) { audio.adjustStreamVolume(AudioManager.STREAM_MUSIC, dir, AudioManager.FLAG_SHOW_UI) }
                  return Natija(true, msg, listOf(javob))
              }

              private fun ovozBir(dir: Int, msg: String, javob: String): Natija {
                  audio.adjustStreamVolume(AudioManager.STREAM_MUSIC, dir, AudioManager.FLAG_SHOW_UI)
                  return Natija(true, msg, listOf(javob))
              }

              private fun media(code: Int, msg: String, javob: String): Natija {
                  audio.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, code))
                  audio.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_UP, code))
                  return Natija(true, msg, listOf(javob))
              }

              // ---- Qo'ng'iroq ----
              private fun qongiroq(t: String): Natija {
                  val ism = maqsad(t, listOf("qongiroq qil", "qongiroq", "qongroq", "telefon qil", "chaqir"))
                  if (ism.isBlank()) return Natija(false, "Kimga qo'ng'iroq qilay?", listOf("kimga"))
                  if (!ruxsat(Manifest.permission.READ_CONTACTS)) return Natija(false, "Kontaktlarga ruxsat berilmagan", listOf("ruxsat_yoq"))
                  val raqam = kontaktTop(ism) ?: return Natija(false, "\"$ism\" kontakti topilmadi", listOf("kontakt_yoq"))
                  val action = if (ruxsat(Manifest.permission.CALL_PHONE)) Intent.ACTION_CALL else Intent.ACTION_DIAL
                  return och(Intent(action, Uri.parse("tel:" + Uri.encode(raqam))), "$ism ga qo'ng'iroq qilinmoqda", "qongiroq")
              }

              private fun kontaktTop(ism: String): String? {
                  val royxat = mutableListOf<Pair<String, String>>()
                  ctx.contentResolver.query(
                      ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                      arrayOf(
                          ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                          ContactsContract.CommonDataKinds.Phone.NUMBER
                      ), null, null, null
                  )?.use { c ->
                      while (c.moveToNext()) {
                          val n = normalize(c.getString(0) ?: continue)
                          val num = c.getString(1) ?: continue
                          royxat.add(n to num)
                      }
                  }
                  return royxat.firstOrNull { it.first == ism }?.second
                      ?: royxat.firstOrNull { it.first.split(" ").contains(ism) }?.second
                      ?: royxat.firstOrNull { it.first.contains(ism) }?.second
              }

              // ---- Navigatsiya ----
              private fun yol(t: String): Natija {
                  val joy = maqsad(
                      t, listOf(
                          "olib bor", "yol korsat", "boramiz", "boraman", "borish", "navigator",
                          "manzil", "marshrut", "qanday", "yol", "och"
                      )
                  )
                  if (joy.isBlank()) {
                      for (p in listOf(YANDEX_NAVI, YANDEX_MAPS, GOOGLE_MAPS)) {
                          pm.getLaunchIntentForPackage(p)?.let { return och(it, "Navigator ochildi", "navigator") }
                      }
                      return Natija(false, "Navigator topilmadi", listOf("navigator_yoq"))
                  }
                  val variantlar = listOf(
                      Intent(Intent.ACTION_VIEW, Uri.parse("yandexnavi://map_search?text=" + Uri.encode(joy))).setPackage(YANDEX_NAVI),
                      Intent(Intent.ACTION_VIEW, Uri.parse("yandexmaps://maps.yandex.ru/?text=" + Uri.encode(joy))).setPackage(YANDEX_MAPS),
                      Intent(Intent.ACTION_VIEW, Uri.parse("geo:0,0?q=" + Uri.encode(joy)))
                  )
                  for (i in variantlar) if (i.resolveActivity(pm) != null) return och(i, "Yo'l: $joy", "yol")
                  return Natija(false, "Xarita ilovasi topilmadi", listOf("navigator_yoq"))
              }

              // ---- Ilova ochish ----
              private fun ilovaOch(t: String): Natija {
                  val nom = maqsad(t, listOf("ochib ber", "och", "ilovasini", "ilovani", "dasturini", "dasturni"))
                  if (nom.isBlank()) return Natija(false, "Qaysi ilovani ochay?", listOf("qaysi_ilova"))
                  val apps = pm.queryIntentActivities(
                      Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0
                  )
                  val nomlar = apps.map { normalize(it.loadLabel(pm).toString()) to it.activityInfo.packageName }
                  val pkg = nomlar.firstOrNull { it.first == nom }?.second
                      ?: nomlar.firstOrNull { it.first.contains(nom) }?.second
                      ?: nomlar.firstOrNull { it.first.length >= 3 && nom.contains(it.first) }?.second
                      ?: return Natija(false, "\"$nom\" ilovasi topilmadi", listOf("ilova_yoq"))
                  val i = pm.getLaunchIntentForPackage(pkg) ?: return Natija(false, "Ochib bo'lmadi", listOf("xato"))
                  return och(i, "$nom ochildi", "ilova_och")
              }

              // ---- Yordamchi funksiyalar ----
              /** Buyruqdan kalit so'zlarni olib tashlab, nishonni qoldiradi: "akamga qongiroq qil" -> "akam" */
              private fun maqsad(t: String, kalitlar: List<String>): String {
                  var s = t
                  for (k in kalitlar) s = s.replace(Regex("\\b" + Regex.escape(k) + "\\b"), " ")
                  val sozlar = s.split(" ").map { it.trim() }
                      .filter { it.isNotEmpty() && it !in KERAKSIZ }.toMutableList()
                  if (sozlar.isEmpty()) return ""
                  val oxirgi = sozlar.last()
                  val q = QOSHIMCHALAR.firstOrNull { oxirgi.length > it.length + 2 && oxirgi.endsWith(it) }
                  if (q != null) sozlar[sozlar.size - 1] = oxirgi.dropLast(q.length)
                  return sozlar.joinToString(" ")
              }

              private fun ruxsat(p: String) =
                  ContextCompat.checkSelfPermission(ctx, p) == PackageManager.PERMISSION_GRANTED

              private fun och(i: Intent, msg: String, javob: String): Natija = try {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  ctx.startActivity(i)
                  Natija(true, msg, listOf(javob))
              } catch (e: Exception) {
                  Natija(false, "Xato: ${e.message}", listOf("xato"))
              }
          }
          YORDAMCHI_EOF
          cat > app/src/main/java/uz/byd/yordamchi/MainActivity.kt <<'YORDAMCHI_EOF'
          package uz.byd.yordamchi

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.provider.Settings
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {

              private lateinit var holatMatn: TextView
              private val handler = Handler(Looper.getMainLooper())
              private var sinov: CommandProcessor? = null
              private var sinovOvoz: Ovoz? = null

              private val yangilash = object : Runnable {
                  override fun run() {
                      holatMatn.text = "Holat: ${VoiceService.holat}"
                      handler.postDelayed(this, 1000)
                  }
              }

              private val yordam = """
                  Qanday ishlatiladi:
                  "Yordamchi" deng → signal chalinadi → buyruqni ayting.
                  Yoki birga: "Yordamchi, musiqani to'xtat".

                  🎵 Musiqa: musiqa qo'y · to'xtat · keyingi · oldingi
                  🔊 Ovoz: ovozni oshir · ovozni pasaytir · ovozni o'chir · ovozni yoq
                  🗺 Yo'l: Chorsu bozoriga olib bor · navigatorni och
                  📞 Qo'ng'iroq: akamga qo'ng'iroq qil
                  📱 Ilova: telegramni och
                  🕐 Vaqt: soat necha
                  💬 Suhbat: rahmat · qalaysan · kimsan
              """.trimIndent()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 40, 40, 40)
                  }
                  fun matn(s: String, size: Float = 18f) = TextView(this).apply {
                      text = s; textSize = size; setPadding(0, 12, 0, 12)
                  }
                  fun tugma(s: String, f: () -> Unit) = Button(this).apply {
                      text = s; textSize = 18f; isAllCaps = false; setOnClickListener { f() }
                  }

                  root.addView(matn("BYD Yordamchi", 28f))
                  holatMatn = matn("Holat: ...")
                  root.addView(holatMatn)
                  root.addView(tugma("1. Ruxsatlarni berish") { ruxsatSora() })
                  root.addView(tugma("2. Boshqa ilovalar ustida ochish ruxsati") { overlayRuxsati() })
                  root.addView(tugma("3. Yordamchini ishga tushirish") { VoiceService.start(this) })
                  root.addView(tugma("4. Batareya cheklovini o'chirish") { batareya() })
                  root.addView(tugma("To'xtatish") { stopService(Intent(this, VoiceService::class.java)) })

                  val kirish = EditText(this).apply { hint = "Buyruqni yozib sinab ko'ring" }
                  root.addView(kirish)
                  root.addView(tugma("Sinash") {
                      val p = sinov ?: CommandProcessor(this).also { sinov = it }
                      val n = p.execute(kirish.text.toString())
                      (sinovOvoz ?: Ovoz(this).also { sinovOvoz = it }).gapir(n.ovozlar)
                      Toast.makeText(this, n.matn, Toast.LENGTH_LONG).show()
                  })
                  root.addView(matn(yordam, 16f))

                  setContentView(ScrollView(this).apply { addView(root) })
                  ruxsatSora()
              }

              override fun onResume() { super.onResume(); handler.post(yangilash) }
              override fun onPause() { handler.removeCallbacks(yangilash); super.onPause() }
              override fun onDestroy() { sinovOvoz?.yop(); super.onDestroy() }

              private fun ruxsatSora() {
                  val r = mutableListOf(
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.READ_CONTACTS,
                      Manifest.permission.CALL_PHONE
                  )
                  if (Build.VERSION.SDK_INT >= 33) r.add(Manifest.permission.POST_NOTIFICATIONS)
                  requestPermissions(r.toTypedArray(), 1)
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int, permissions: Array<out String>, grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                      VoiceService.start(this)
                      if (!Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "Endi 2-tugmani bosib, ruxsatni yoqing", Toast.LENGTH_LONG).show()
                      }
                  } else {
                      Toast.makeText(this, "Mikrofonsiz ishlay olmayman", Toast.LENGTH_LONG).show()
                  }
              }

              private fun batareya() {
                  val pm = getSystemService(PowerManager::class.java)
                  if (pm.isIgnoringBatteryOptimizations(packageName)) {
                      Toast.makeText(this, "Allaqachon o'chirilgan ✓", Toast.LENGTH_SHORT).show()
                      return
                  }
                  try {
                      startActivity(
                          Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:$packageName"))
                      )
                  } catch (e: Exception) {
                      Toast.makeText(this, "Sozlamalar → Batareya bo'limidan qo'lda o'chiring", Toast.LENGTH_LONG).show()
                  }
              }

              private fun overlayRuxsati() {
                  try {
                      startActivity(
                          Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                      )
                  } catch (e: Exception) {
                      Toast.makeText(this, "Sozlamalardan qo'lda yoqing", Toast.LENGTH_LONG).show()
                  }
              }
          }
          YORDAMCHI_EOF

      - uses: actions/setup-java@v5
